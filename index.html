<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx5X0YbLUu0y0aEZ2pZPPjX9IeZrVkgMxnKvQG-FojOHTrqA__ltD9wF8OwZEqmzg3s/exec";
    const formatRp = (number) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number || 0);
    const Icon = ({ name, className = "" }) => <span className={`material-symbols-outlined ${className}`}>{name}</span>;
    
    const showAlert = (options) => {
      if (window.Swal) return window.Swal.fire({ ...options, confirmButtonColor: '#4f46e5', borderRadius: '1rem' });
      else console.warn('Swal not loaded:', options.title);
    };
    
    // --- KOMPONEN CAMERA SCANNER (FIXED & ROBUST BACK/FRONT AUTO DETECT) ---
    function CameraScanner({ isOpen, onClose, onScan }) {
      const onScanRef = useRef(onScan);
      const onCloseRef = useRef(onClose);

      useEffect(() => {
        onScanRef.current = onScan;
        onCloseRef.current = onClose;
      }, [onScan, onClose]);

      useEffect(() => {
        if (!isOpen) return;
        const html5QrCode = new window.Html5Qrcode("reader");
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };
        let isMounted = true;

        const onSuccess = (decodedText) => {
          if (isMounted) {
            onScanRef.current(decodedText);
            onCloseRef.current();
          }
        };

        html5QrCode.start({ facingMode: "environment" }, config, onSuccess, undefined).catch(err => {
          if (isMounted) {
            html5QrCode.start({ facingMode: "user" }, config, onSuccess, undefined).catch(err2 => {
              console.error("Gagal akses kamera:", err2);
              if (isMounted) {
                showAlert({icon: 'error', title: 'Kamera Gagal', text: 'Pastikan izin kamera diberikan untuk browser ini.'});
                onCloseRef.current();
              }
            });
          }
        });

        return () => {
          isMounted = false;
          try {
            if (html5QrCode.isScanning) {
              html5QrCode.stop().catch(() => {});
            }
          } catch (e) {}
        };
      }, [isOpen]);

      if (!isOpen) return null;
      return ReactDOM.createPortal(
        <div className="fixed inset-0 bg-slate-900/90 z-[9999] flex flex-col items-center justify-center p-4">
          <div className="bg-white rounded-3xl overflow-hidden w-full max-w-md shadow-2xl relative">
            <div className="p-4 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
              <h3 className="font-black text-slate-800 flex items-center gap-2"><Icon name="qr_code_scanner" className="text-indigo-600"/> Scan Barcode</h3>
              <button onClick={onClose} className="p-2 bg-slate-200 hover:bg-slate-300 rounded-full text-slate-600 transition"><Icon name="close"/></button>
            </div>
            <div className="p-4">
              <div id="reader" className="w-full bg-black rounded-xl overflow-hidden min-h-[300px]"></div>
              <p className="text-center text-xs text-slate-500 mt-4 font-medium">Arahkan kamera ke Barcode / QR Code produk.</p>
            </div>
          </div>
        </div>, document.body
      );
    }
    
    function App() {
      const [userRole, setUserRole] = useState(null);
      const [currentUser, setCurrentUser] = useState(''); 
      const [loading, setLoading] = useState(true);
      const [products, setProducts] = useState([]);
      const [categories, setCategories] = useState([]);
      const [transactions, setTransactions] = useState([]);
      const [balances, setBalances] = useState({ kembalian: 0 });
      const [users, setUsers] = useState([]); 
      
      const [storeConfig, setStoreConfig] = useState({ 
        name: 'KassQu', address: 'Pusat Perbelanjaan', phone: '0812345678', footer: 'Terima Kasih Atas Kunjungan Anda', logo: '', banner: ''
      });

      const syncToGoogleSheets = async (action, data) => {
        try {
          fetch(APP_SCRIPT_URL, {
            method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action, data, timestamp: new Date().toISOString() })
          }).catch(err => console.error("Sync fetch error:", err));
        } catch (error) { console.error("Sync Error:", error); }
      };
      
      useEffect(() => {
        const savedRole = localStorage.getItem('kassqu_role');
        const savedUser = localStorage.getItem('kassqu_user');
        if (savedRole) { setUserRole(savedRole); setCurrentUser(savedUser || ''); }

        const loadData = async () => {
          try {
            const res = await fetch(APP_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'GET_INITIAL_DATA' }) });
            const result = await res.json();
            if (result.status === 'success') {
              setProducts(result.data.products || []);
              setCategories(result.data.categories || []);
              setTransactions(result.data.transactions || []);
              if (result.data.balances) setBalances(result.data.balances);
              if (result.data.storeConfig) setStoreConfig(result.data.storeConfig);
              if (result.data.users) setUsers(result.data.users); 
            }
          } catch (e) { console.error("Load Error:", e); } 
          finally { setLoading(false); }
        };
        loadData();
      }, []);

      const handleLoginSuccess = (role, userName) => {
        setUserRole(role);
        setCurrentUser(userName); 
        localStorage.setItem('kassqu_role', role);
        localStorage.setItem('kassqu_user', typeof userName === 'object' ? JSON.stringify(userName) : userName);
      };

      const handleLogout = () => {
        if(window.Swal) {
          window.Swal.fire({
            title: 'Keluar Sistem?', icon: 'question', showCancelButton: true, confirmButtonText: 'Ya, Keluar', cancelButtonText: 'Batal', confirmButtonColor: '#ef4444'
          }).then((res) => {
            if(res.isConfirmed) {
              setUserRole(null); setCurrentUser('');
              localStorage.removeItem('kassqu_role'); localStorage.removeItem('kassqu_user');
            }
          });
        } else {
          setUserRole(null); setCurrentUser('');
          localStorage.removeItem('kassqu_role'); localStorage.removeItem('kassqu_user');
        }
      };

      if (loading) return (
        <div className="full-immersive flex-col text-white overscroll-none select-none">
          <div className="w-16 h-16 border-4 border-indigo-500 border-t-white rounded-full animate-spin mb-6 shadow-xl"></div>
          <div className="flex items-center gap-3"><div className="bg-indigo-600 w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg"><Icon name="point_of_sale" className="text-white text-3xl" /></div><h1 className="text-4xl font-black tracking-widest drop-shadow-md">KASSQU</h1></div>
          <p className="text-sm font-medium opacity-80 mt-4 tracking-wide">Menyiapkan toko Anda...</p>
        </div>
      );
      
      if (!userRole) return <LoginScreen onLogin={handleLoginSuccess} storeConfig={storeConfig} users={users} />;

      return (
        <div className="min-h-screen bg-slate-50 font-sans text-slate-800 selection:bg-indigo-200">
          {userRole === 'kasir' ? (
            <KasirDashboard 
              products={products} categories={categories} storeConfig={storeConfig} transactions={transactions} currentUser={currentUser}
              onLogout={handleLogout}
              onTransactionSuccess={(trx) => {
                setTransactions(prev => [trx, ...prev]); syncToGoogleSheets('ADD_TRANSACTION', trx);
                if (trx.method === 'Cash') { setBalances(prev => { const nb = { ...prev, kembalian: (prev.kembalian || 0) + trx.total }; syncToGoogleSheets('UPDATE_BALANCES', nb); return nb; }); }
              }}
              onDeleteTransaction={(id) => { setTransactions(prev => prev.filter(t => t.id !== id)); syncToGoogleSheets('DELETE_TRANSACTION', { id }); }}
            />
          ) : (
            <AdminDashboard 
              products={products} setProducts={setProducts} categories={categories} setCategories={setCategories}
              transactions={transactions} storeConfig={storeConfig} setStoreConfig={setStoreConfig} balances={balances} setBalances={setBalances}
              users={users} setUsers={setUsers} onLogout={handleLogout} syncToSheets={syncToGoogleSheets}
            />
          )}
        </div>
      );
    }

    function LoginScreen({ onLogin, storeConfig, users }) {
      const [role, setRole] = useState('kasir');
      const [pin, setPin] = useState('');

      const handleLogin = async (e) => {
        e.preventDefault();
        const inputPin = pin.trim();
        const selectedRole = role.toLowerCase();

        if (!inputPin) return showAlert({ icon: 'warning', title: 'Perhatian', text: 'Masukkan PIN!' });

        if (users && users.length > 0) {
          const matchedUser = users.find(u => String(u.pin).trim() === inputPin && String(u.status).trim().toLowerCase() === 'aktif');
          if (matchedUser) {
            const userRoleDb = matchedUser.kode.toLowerCase().trim();
            if (userRoleDb.includes(selectedRole)) {
              return onLogin(role, matchedUser.nama || matchedUser.kode); 
            } else {
              return showAlert({ icon: 'error', title: 'Akses Ditolak', text: `Akses ditolak! PIN terdaftar untuk ${userRoleDb.toUpperCase()}.` });
            }
          } else {
            return showAlert({ icon: 'error', title: 'PIN Salah', text: 'PIN salah atau belum terdaftar!' });
          }
        }

        if(window.Swal) window.Swal.fire({ title: 'Memverifikasi server...', allowOutsideClick: false, didOpen: () => window.Swal.showLoading() });
        
        try {
          const response = await fetch(APP_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'CHECK_LOGIN', data: { cashierCode: role.toUpperCase(), pin: inputPin } }) });
          const result = await response.json();
          if (result && result.valid) {
            if (window.Swal) window.Swal.close();
            onLogin(role, role.toUpperCase());
          } else {
            showAlert({ icon: 'error', title: 'Akses Ditolak', text: 'PIN salah atau tidak terdaftar di server!' });
          }
        } catch (err) {
          showAlert({ icon: 'error', title: 'Koneksi Gagal', text: 'Gagal terhubung ke server.' });
        }
      };

      return (
        <div className="full-immersive p-4 overscroll-none select-none">
          <div className="bg-white/10 backdrop-blur-md border border-white/20 rounded-[2.5rem] shadow-[0_8px_32px_0_rgba(0,0,0,0.3)] w-full max-w-sm p-8 text-center transform transition-all hover:scale-[1.01] duration-300 relative overflow-hidden">
            <div className="absolute -top-20 -left-20 w-48 h-48 bg-white/20 rounded-full blur-3xl pointer-events-none"></div>
            {storeConfig?.logo ? (
               <div className="relative z-10 w-24 h-24 mx-auto mb-5 rounded-[1.5rem] shadow-xl overflow-hidden bg-white flex items-center justify-center p-2 border border-white/50">
                 <img src={storeConfig.logo} alt="Logo" className="w-full h-full object-contain" />
               </div>
            ) : (
              <div className="relative z-10 bg-white/20 border border-white/30 backdrop-blur-sm w-20 h-20 rounded-[1.5rem] flex items-center justify-center mx-auto mb-5 shadow-xl"><Icon name="point_of_sale" className="text-white text-4xl" /></div>
            )}
            <h1 className="relative z-10 text-3xl font-black text-white tracking-tight mb-1 drop-shadow-md">{storeConfig?.name || 'KassQu'}</h1>
            <p className="relative z-10 text-white/80 text-sm font-medium mb-8 drop-shadow-sm">Masuk untuk melanjutkan</p>
            <form onSubmit={handleLogin} className="space-y-6 relative z-10">
              <div className="flex bg-white p-1.5 rounded-[1.25rem] shadow-sm">
                <button type="button" onClick={() => setRole('kasir')} className={`flex-1 py-3.5 rounded-xl font-bold transition-all duration-300 ${role === 'kasir' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-600'}`}>KASIR</button>
                <button type="button" onClick={() => setRole('admin')} className={`flex-1 py-3.5 rounded-xl font-bold transition-all duration-300 ${role === 'admin' ? 'bg-red-500 text-white shadow-md' : 'text-slate-400 hover:text-slate-600'}`}>ADMIN</button>
              </div>
              <div>
                <input type="password" value={pin} onChange={(e) => setPin(e.target.value)} placeholder="Masukkan PIN" required className="w-full px-6 py-4 rounded-2xl bg-white text-slate-800 placeholder-slate-400 focus:border-indigo-300 focus:ring-4 focus:ring-indigo-100 outline-none transition-all text-center text-base font-medium shadow-sm border border-transparent" />
              </div>
              <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-2xl font-bold shadow-lg shadow-indigo-600/30 transition-all active:scale-95 text-lg flex items-center justify-center gap-2">Masuk Aplikasi</button>
            </form>
          </div>
        </div>
      );
    }
    
    // ==========================================
    // 2. DASHBOARD KASIR
    // ==========================================
    function KasirDashboard({ products, categories, storeConfig, transactions, currentUser, onLogout, onTransactionSuccess, onDeleteTransaction }) {
      const [cart, setCart] = useState([]);
      const [showPayment, setShowPayment] = useState(false);
      const [paymentMethod, setPaymentMethod] = useState('Cash');
      const [searchQuery, setSearchQuery] = useState('');
      const [paymentAmount, setPaymentAmount] = useState('');
      const [activeCategory, setActiveCategory] = useState('Semua');
      const [lastInvoice, setLastInvoice] = useState(null);
      const [isMobileCartOpen, setIsMobileCartOpen] = useState(false);
      const [showHistory, setShowHistory] = useState(false);
      const [currentQueueNo, setCurrentQueueNo] = useState(null);
      const [noteModal, setNoteModal] = useState({ isOpen: false, product: null, note: '' });
      const [isScannerOpen, setIsScannerOpen] = useState(false);

      let safeUserName = currentUser || 'Staff';
      if (typeof currentUser === 'string' && currentUser.includes('{')) {
        try {
          const parsed = JSON.parse(currentUser);
          safeUserName = parsed.namaKasir || parsed.nama || parsed.kodeKasir || 'Staff';
        } catch(e) {}
      } else if (typeof currentUser === 'object' && currentUser !== null) {
        safeUserName = currentUser.namaKasir || currentUser.nama || currentUser.kodeKasir || 'Staff';
      }

      useEffect(() => { if (cart.length === 0 && currentQueueNo) setCurrentQueueNo(null); }, [cart.length, currentQueueNo]);

      const generateQueueNo = () => {
        const today = new Date().toDateString();
        const todayTrx = transactions.filter(t => new Date(t.date).toDateString() === today);
        return (todayTrx.length + 1).toString().padStart(3, '0');
      };

      const filteredProducts = useMemo(() => {
        const query = searchQuery.toLowerCase().trim();
        return products.filter(p => {
          const matchCat = activeCategory === 'Semua' || p.category === activeCategory;
          const matchSearch = String(p.name).toLowerCase().includes(query) || 
                              String(p.barcode || '').toLowerCase().includes(query);
          return matchCat && matchSearch;
        });
      }, [products, activeCategory, searchQuery]);

      const openNoteModal = (product) => {
        if (product.stock <= 0) return showAlert({ icon: 'error', title: 'Habis', text: 'Stok barang kosong!' });
        setNoteModal({ isOpen: true, product, note: '' });
      };

      const addToCart = (product, note = '') => {
        const cartItemId = note ? `${product.id}-${note.toLowerCase().trim()}` : product.id;
        setCart(prev => {
          const existing = prev.find(item => (item.cartItemId || item.id) === cartItemId);
          if (existing) {
            if (existing.qty >= product.stock) { showAlert({ icon: 'warning', title: 'Batas Maksimal', text: 'Stok maksimal telah tercapai.' }); return prev; }
            return prev.map(item => (item.cartItemId || item.id) === cartItemId ? { ...item, qty: item.qty + 1 } : item);
          }
          return [...prev, { ...product, cartItemId, note, price: product.price - (product.diskon || 0), originalPrice: product.price, qty: 1, diskon: product.diskon || 0 }];
        });
      };

      // Handle pencarian via Keyboard / Gun Scanner & CAMERA Direct Match
      const handleSearchKeyDown = (e, scannedText = null) => {
        if (e.key === 'Enter') {
          const queryValue = scannedText !== null ? scannedText : searchQuery;
          if (queryValue.trim() !== '') {
            const query = queryValue.trim().toLowerCase();
            const exactMatch = products.find(p => (p.barcode && p.barcode.toLowerCase() === query) || p.id.toLowerCase() === query);
            
            if (exactMatch) {
              if (exactMatch.stock <= 0) {
                showAlert({ icon: 'error', title: 'Habis', text: 'Stok barang kosong!' });
              } else {
                addToCart(exactMatch);
                setSearchQuery(''); 
              }
            } else if (scannedText) {
              showAlert({ icon: 'warning', title: 'Tidak Ditemukan', text: 'Produk dengan barcode ini tidak ditemukan.' });
            }
          }
        }
      };
      
      const updateQty = (cartItemId, delta) => {
        setCart(prev => prev.map(item => { if ((item.cartItemId || item.id) === cartItemId) return { ...item, qty: Math.max(1, item.qty + delta) }; return item; }));
      };

      const removeFromCart = (cartItemId) => setCart(prev => prev.filter(item => (item.cartItemId || item.id) !== cartItemId));
      const totalBelanja = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      const processQueueOnly = () => {
        const transactionData = { id: `INV-${Date.now().toString().slice(-6)}`, queueNo: currentQueueNo || generateQueueNo(), date: new Date().toISOString(), items: cart, total: totalBelanja, payment: 0, change: 0, method: 'Belum Bayar' };
        setLastInvoice(transactionData); onTransactionSuccess(transactionData);
        setCart([]); setIsMobileCartOpen(false); setCurrentQueueNo(null);
      };

      const processPayment = () => {
        const bayar = paymentMethod === 'Cash' ? (parseInt(paymentAmount.replace(/\D/g, '')) || 0) : totalBelanja;
        if (paymentMethod === 'Cash' && bayar < totalBelanja) return showAlert({ icon: 'error', title: 'Uang Kurang!', text: 'Nominal pembayaran tidak mencukupi.' });
        const transactionData = { id: `INV-${Date.now().toString().slice(-6)}`, queueNo: currentQueueNo || generateQueueNo(), date: new Date().toISOString(), items: cart, total: totalBelanja, payment: bayar, change: bayar - totalBelanja, method: paymentMethod };
        setLastInvoice(transactionData); onTransactionSuccess(transactionData);
        setCart([]); setShowPayment(false); setIsMobileCartOpen(false); setCurrentQueueNo(null);
      };

      const resumeTransaction = (trx) => {
        const executeResume = () => { setCart(trx.items); setCurrentQueueNo(trx.queueNo); onDeleteTransaction(trx.id); setShowHistory(false); };
        if (cart.length > 0) {
          if (window.Swal) window.Swal.fire({ title: 'Ganti Pesanan Aktif?', text: 'Keranjang tidak kosong. Ganti dengan pesanan ini?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#4f46e5', confirmButtonText: 'Ya, Ganti', cancelButtonText: 'Batal' }).then((res) => { if (res.isConfirmed) executeResume(); });
          else executeResume();
        } else executeResume();
      };

      // FUNGSI HELPER UNTUK OFF-SCREEN RENDER CANVAS (ANTI POTONG/BLANK)
      const generateCanvasFromInvoice = async (elementId) => {
        const original = document.getElementById(elementId);
        if (!original) throw new Error("Struk tidak ditemukan");
        
        // Clone struk agar original UI tidak terganggu
        const clone = original.cloneNode(true);
        // Paksa clone punya ukuran bebas/penuh, dan sembunyikan di luar layar
        clone.style.position = 'fixed';
        clone.style.top = '-9999px';
        clone.style.left = '-9999px';
        clone.style.width = '320px'; // Ukuran standar struk thermal
        clone.style.height = 'auto';
        clone.style.overflow = 'visible';
        clone.style.maxHeight = 'none';
        clone.classList.remove('overflow-y-auto', 'max-h-[95vh]');
        
        document.body.appendChild(clone);
        
        // Jalankan html2canvas di clone tersebut
        const canvas = await window.html2canvas(clone, { 
          scale: 2, 
          backgroundColor: '#ffffff', 
          useCORS: true,
          allowTaint: true,
          logging: false 
        });
        
        document.body.removeChild(clone);
        return canvas;
      };

      // FUNGSI PRINT (Cetak)
      const handlePrint = () => {
        const original = document.getElementById('print-invoice');
        if (!original) return;
        
        // Hapus clone lama jika sebelumnya error
        const oldClone = document.getElementById('print-clone');
        if (oldClone) oldClone.remove();

        // Siapkan node baru untuk dicetak
        const clone = original.cloneNode(true); 
        clone.id = 'print-clone'; 
        
        // Buang batas tinggi agar cetakan lolos full ke bawah (nggak kepotong 1 halaman)
        clone.classList.remove('overflow-y-auto', 'max-h-[95vh]', 'shadow-sm', 'border');
        clone.style.height = 'auto';
        clone.style.overflow = 'visible';
        clone.style.maxHeight = 'none';

        document.body.appendChild(clone);
        
        setTimeout(() => { 
          window.print(); 
          // Bersihkan DOM setelah dialog print selesai/ditutup
          setTimeout(() => { 
            const cloneEl = document.getElementById('print-clone'); 
            if(cloneEl) cloneEl.remove(); 
          }, 1000); 
        }, 300);
      };

      // FUNGSI SIMPAN GAMBAR
      const handleDownloadImage = async () => {
        if(window.Swal) window.Swal.fire({ title: 'Memproses Struk...', text: 'Menyimpan sebagai gambar', allowOutsideClick: false, didOpen: () => window.Swal.showLoading() });
        
        try {
          const canvas = await generateCanvasFromInvoice('print-invoice');
          const dataUrl = canvas.toDataURL('image/png');
          
          const link = document.createElement('a'); 
          link.download = `Struk-${lastInvoice.id}.png`; 
          link.href = dataUrl; 
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          
          if(window.Swal) window.Swal.close();
        } catch (err) { 
          console.error(err);
          if(window.Swal) window.Swal.close();
          showAlert({ icon: 'error', title: 'Gagal', text: 'Gagal merender & menyimpan struk.' }); 
        }
      };

      // FUNGSI SHARE WA
      const handleShareWA = async () => {
        if(window.Swal) window.Swal.fire({ title: 'Menyiapkan Share WA...', text: 'Harap tunggu...', allowOutsideClick: false, didOpen: () => window.Swal.showLoading() });
        
        try {
          const canvas = await generateCanvasFromInvoice('print-invoice');
          
          canvas.toBlob(async (blob) => {
            if (!blob) throw new Error("Gagal konversi gambar"); 
            const file = new File([blob], `Struk-${lastInvoice.id}.png`, { type: 'image/png' });
            
            if(window.Swal) window.Swal.close();
            
            // Coba Web Share API (Biasa support di HP Android/iOS)
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              try {
                await navigator.share({ files: [file], title: `Struk Transaksi`, text: `Terima kasih telah berbelanja!` });
              } catch (e) { console.log('Share dibatalkan user', e); }
            } else { 
              // Jika di PC / Browser tidak support share file gambar ke WA, jadikan format teks otomatis
              let textItems = lastInvoice.items.map(i => `${i.qty}x ${i.name} = ${formatRp(i.price * i.qty)}`).join('%0A');
              const textContent = `*STRUK TRANSAKSI* %0AID: ${lastInvoice.id} %0ATgl: ${new Date(lastInvoice.date).toLocaleString('id-ID')} %0A%0A${textItems} %0A%0A*TOTAL: ${formatRp(lastInvoice.total)}* %0A%0ATerima kasih!`;
              const waUrl = `https://wa.me/?text=${textContent}`;
              window.open(waUrl, '_blank');
            }
          }, 'image/png');
        } catch (err) { 
          console.error(err);
          if(window.Swal) window.Swal.close();
          showAlert({ icon: 'error', title: 'Gagal', text: 'Sistem gagal membagikan struk.' }); 
        }
      };

                {storeConfig?.logo ? (
                  <img src={storeConfig.logo} alt="Logo" crossOrigin="anonymous" className="w-12 h-12 object-contain rounded-xl border border-slate-200 p-0.5 shrink-0 bg-white" />

                </div>
                <div className="flex lg:hidden items-center gap-1 shrink-0">

                  <button onClick={onLogout} className="p-2 text-red-500 hover:bg-red-50 rounded-xl transition-all"><Icon name="logout" className="text-[22px]" /></button>
                </div>
              </div>

              <div className="flex-1 max-w-2xl w-full">

                   <Icon name="image" className="text-4xl mb-2 opacity-50" />

                    <div className="absolute inset-0 bg-gradient-to-r from-indigo-900/90 to-transparent flex items-center p-6">

                {filteredProducts.length === 0 && (

            {!isMobileCartOpen && cart.length > 0 && (

    // --- SUB KOMPONEN CHART ---
    function PieChart({ data, labels, title, colors, isCurrency = false }) {
      const chartRef = useRef(null); const chartInstance = useRef(null);
      useEffect(() => {
        if (chartInstance.current) chartInstance.current.destroy();
        if (!chartRef.current || !window.Chart) return;
        const ctx = chartRef.current.getContext('2d');
        chartInstance.current = new window.Chart(ctx, {
          type: 'doughnut',
          data: { labels: labels, datasets: [{ data: data, backgroundColor: colors || ['#4f46e5', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6', '#64748b'], borderWidth: 0, hoverOffset: 6 }] },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
              legend: { position: 'right', labels: { boxWidth: 12, usePointStyle: true, font: { family: "'Inter', sans-serif", size: 11 } } },
              tooltip: { backgroundColor: 'rgba(15, 23, 42, 0.9)', padding: 12, cornerRadius: 8, callbacks: { label: function(context) { let label = context.label || ''; if (label) { label += ': '; } const val = context.raw !== undefined ? context.raw : context.parsed; if (val !== null && val !== undefined) { label += isCurrency ? new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(val) : val + ' item'; } return label; } } }
            }, cutout: '70%'
          }
        });
        return () => { if (chartInstance.current) chartInstance.current.destroy(); };
      }, [data, labels, title, colors, isCurrency]);
      if (!data || data.length === 0) return <div className="h-[250px] flex items-center justify-center text-slate-400 text-sm font-medium border-2 border-dashed border-slate-200 rounded-2xl">Belum ada data memadai</div>;
      return <div className="flex flex-col h-full"><h3 className="font-bold text-slate-700 mb-4">{title}</h3><div className="relative flex-1 min-h-[220px]"><canvas ref={chartRef}></canvas></div></div>;
    }

    // --- SUB KOMPONEN LAPORAN ---
    function AdminReport({ transactions, storeConfig }) {
      const [filter, setFilter] = useState('today');
      const [startDate, setStartDate] = useState(new Date().toISOString().split('T')[0]);
      const [endDate, setEndDate] = useState(new Date().toISOString().split('T')[0]);
      
      const filteredTransactions = useMemo(() => {
        const now = new Date();
        return transactions.filter(trx => {
          const d = new Date(trx.date);
          if (filter === 'today') return d.toDateString() === now.toDateString();
          if (filter === 'week') { const startOfWeek = new Date(); startOfWeek.setDate(now.getDate() - now.getDay()); startOfWeek.setHours(0, 0, 0, 0); return d >= startOfWeek; }
          if (filter === 'month') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
          if (filter === 'custom') { const start = new Date(startDate); const end = new Date(endDate); start.setHours(0, 0, 0, 0); end.setHours(23, 59, 59, 999); return d >= start && d <= end; }
          return true;
        });
      }, [transactions, filter, startDate, endDate]);

      const calcSummary = (trxs) => trxs.reduce((acc, trx) => {
        if (trx.method !== 'Belum Bayar') { acc.omzet += trx.total; trx.items.forEach(i => { acc.modal += (i.modal || 0) * i.qty; acc.laba += (i.price - (i.modal || 0)) * i.qty; }); }
        return acc;
      }, { omzet: 0, modal: 0, laba: 0 });

      const summary = calcSummary(filteredTransactions);
      const paymentStats = useMemo(() => { const stats = {}; filteredTransactions.forEach(trx => { if (trx.method !== 'Belum Bayar') stats[trx.method] = (stats[trx.method] || 0) + trx.total; }); return { labels: Object.keys(stats), data: Object.values(stats) }; }, [filteredTransactions]);
      const productStats = useMemo(() => { const stats = {}; filteredTransactions.forEach(trx => { if (trx.method !== 'Belum Bayar') trx.items.forEach(item => { stats[item.name] = (stats[item.name] || 0) + item.qty; }); }); const sorted = Object.entries(stats).sort((a, b) => b[1] - a[1]).slice(0, 5); return { labels: sorted.map(s => s[0]), data: sorted.map(s => s[1]) }; }, [filteredTransactions]);

      return (
        <div className="space-y-6">
          <div className="relative p-6 md:p-8 rounded-3xl overflow-hidden shadow-lg border border-slate-200">
            <div className="absolute inset-0 z-0"><img src="https://images.unsplash.com/photo-1460925895917-afdab827c52f?q=80&w=2000&auto=format&fit=crop" alt="Background" className="w-full h-full object-cover" /><div className="absolute inset-0 bg-slate-900/75 backdrop-blur-[2px]"></div></div>
            <div className="relative z-10 space-y-6 md:space-y-8">
              <div className="flex flex-col lg:flex-row justify-between lg:items-center gap-4">
                <div><h2 className="text-2xl md:text-3xl font-black text-white">Laporan Keuangan</h2><p className="text-slate-300 font-medium mt-1">Status Belum Bayar (Antrean) tidak dihitung sebagai omzet/laba.</p></div>
                <div className="flex flex-col sm:flex-row items-center gap-3">
                  <div className="relative bg-white/10 backdrop-blur-md rounded-xl flex items-center border border-white/20 w-full sm:w-auto shadow-sm"><Icon name="filter_list" className="text-white/70 absolute left-3.5 text-[18px] pointer-events-none" /><select value={filter} onChange={(e) => setFilter(e.target.value)} className="w-full pl-10 pr-10 py-3 bg-transparent text-sm font-bold text-white outline-none appearance-none cursor-pointer"><option value="today">Hari Ini</option><option value="week">Minggu Ini</option><option value="month">Bulan Ini</option><option value="custom">Pilih Kalender</option></select></div>
                  {filter === 'custom' && <div className="flex items-center gap-2 bg-white/10 backdrop-blur-md p-1.5 rounded-xl border border-white/20 w-full sm:w-auto"><input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} className="bg-white/20 rounded-lg text-xs font-bold text-white outline-none p-2 cursor-pointer border border-white/10" /><span className="text-white/50 font-black">-</span><input type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} className="bg-white/20 rounded-lg text-xs font-bold text-white outline-none p-2 cursor-pointer border border-white/10" /></div>}
                </div>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div className="bg-white/10 backdrop-blur-md border border-amber-400 p-6 md:p-8 rounded-3xl text-white shadow-xl relative overflow-hidden group"><div className="relative z-10"><p className="text-white/80 font-bold mb-2 text-sm uppercase tracking-wider">Total Omzet</p><h3 className="text-3xl md:text-4xl font-black text-amber-400 drop-shadow-md">{formatRp(summary.omzet)}</h3></div></div>
                <div className="bg-white/10 backdrop-blur-md border border-white p-6 md:p-8 rounded-3xl text-white shadow-xl relative overflow-hidden group"><div className="relative z-10"><p className="text-white/80 font-bold mb-2 text-sm uppercase tracking-wider">Total Harga Modal</p><h3 className="text-3xl md:text-4xl font-black text-white drop-shadow-md">{formatRp(summary.modal)}</h3></div></div>
                <div className="bg-white/10 backdrop-blur-md border border-emerald-400 p-6 md:p-8 rounded-3xl text-white shadow-xl relative overflow-hidden group"><div className="relative z-10"><p className="text-white/80 font-bold mb-2 text-sm uppercase tracking-wider">Laba Bersih</p><h3 className="text-3xl md:text-4xl font-black text-emerald-400 drop-shadow-md">{formatRp(summary.laba)}</h3></div></div>
              </div>
            </div>
          </div>
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-100"><PieChart title="Pendapatan per Metode Pembayaran" labels={paymentStats.labels} data={paymentStats.data} colors={['#10b981', '#3b82f6', '#f59e0b']} isCurrency={true}/></div>
            <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-100"><PieChart title="Top 5 Produk Terlaris (Lunas/Qty)" labels={productStats.labels} data={productStats.data} /></div>
          </div>
        </div>
      );
    }

    // --- SUB KOMPONEN PRODUK ---
    function AdminProducts({ products, setProducts, categories, setCategories, syncToSheets }) {
      const [isModalOpen, setIsModalOpen] = useState(false); const [isCategoryModalOpen, setIsCategoryModalOpen] = useState(false);
      const [formData, setFormData] = useState({}); const [searchQuery, setSearchQuery] = useState(''); const [isScannerOpen, setIsScannerOpen] = useState(false);

      const openModal = (p = null) => { 
        setFormData(p ? {...p} : { id: `P${Date.now().toString().slice(-6)}`, name: '', category: categories[0]?.name || '', stock: 0, modal: 0, price: 0, diskon: 0, image: '', barcode: '' }); 
        setIsModalOpen(true); 
      };
      
      const handleImageUpload = (e) => {
        const file = e.target.files[0]; if (!file) return; const reader = new FileReader();
        reader.onload = (event) => { const img = new Image(); img.onload = () => { const canvas = document.createElement('canvas'); const MAX = 300; let w = img.width; let h = img.height; if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } } else { if (h > MAX) { w *= MAX / h; h = MAX; } } canvas.width = w; canvas.height = h; const ctx = canvas.getContext('2d'); ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h); setFormData(prev => ({ ...prev, image: canvas.toDataURL('image/jpeg', 0.6) })); }; img.src = event.target.result; };
        reader.readAsDataURL(file);
      };

      const saveProduct = (e) => {
        e.preventDefault(); const payload = { ...formData, stock: Number(formData.stock), modal: Number(formData.modal), price: Number(formData.price), diskon: Number(formData.diskon || 0) };
        if (products.find(p => p.id === payload.id)) { setProducts(products.map(p => p.id === payload.id ? payload : p)); syncToSheets('UPDATE_PRODUCT', payload); } 
        else { setProducts([...products, payload]); syncToSheets('ADD_PRODUCT', payload); }
        setIsModalOpen(false); showAlert({ icon: 'success', title: 'Tersimpan!' });
      };

      const delProd = (id) => { if (window.Swal) { window.Swal.fire({ title: 'Hapus Produk?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444' }).then((r) => { if (r.isConfirmed) { setProducts(products.filter(p=>p.id!==id)); syncToSheets('DELETE_PRODUCT', {id}); showAlert({ icon: 'success', title: 'Terhapus!' }); } }); } };

      const deleteCategory = (id) => { if (window.Swal) { window.Swal.fire({ title: 'Hapus Kategori?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444' }).then((res) => { if (res.isConfirmed) { setCategories(categories.filter(c => c.id !== id)); syncToSheets('DELETE_CATEGORY', { id }); showAlert({ icon: 'success', title: 'Terhapus!' }); } }); } };

      const filteredProducts = useMemo(() => { const query = searchQuery.toLowerCase().trim(); if (!query) return products; return products.filter(p => String(p.name).toLowerCase().includes(query) || String(p.id).toLowerCase().includes(query) || String(p.barcode || '').toLowerCase().includes(query)); }, [products, searchQuery]);

      return (
        <div className="space-y-6">

            <div className="flex-1 w-full max-w-full xl:max-w-md relative group"><Icon name="search" className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-indigo-600 transition-colors" /><input type="text" placeholder="Cari nama, ID, atau barcode..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full pl-11 pr-4 py-3.5 bg-slate-50 text-slate-800 rounded-2xl focus:ring-4 focus:ring-indigo-400/30 outline-none border border-slate-200"/></div>
            <div className="flex gap-3 shrink-0">
              <button onClick={() => setIsCategoryModalOpen(true)} className="flex-1 md:flex-none bg-slate-100 text-slate-700 px-4 md:px-5 py-3.5 rounded-2xl font-bold hover:bg-slate-200 flex items-center justify-center gap-2"><Icon name="category" className="text-lg"/> <span>Kategori</span></button>
              <button onClick={() => openModal()} className="flex-1 md:flex-none bg-indigo-600 text-white px-4 md:px-6 py-3.5 rounded-2xl font-bold hover:bg-indigo-700 shadow-lg flex items-center justify-center gap-2"><Icon name="add" className="text-lg"/> <span>Tambah Produk</span></button>

            <div className="overflow-x-auto scroll-momentum">
              <table className="w-full text-left text-sm whitespace-nowrap min-w-[800px]">

                  </div>
                  <div className="grid grid-cols-3 gap-3 p-4 bg-slate-50 rounded-2xl border border-slate-100">
                    <div><label className="block text-[10px] font-black text-slate-500 mb-1.5 uppercase">Harga Modal</label><input required type="text" value={formData.modal ? new Intl.NumberFormat('id-ID').format(formData.modal) : ''} onChange={e=>setFormData({...formData, modal: e.target.value.replace(/\D/g, '')})} className="w-full p-3 bg-white border border-slate-200 rounded-xl text-orange-600 font-black text-sm"/></div>
                    <div><label className="block text-[10px] font-black text-slate-500 mb-1.5 uppercase">Harga Jual</label><input required type="text" value={formData.price ? new Intl.NumberFormat('id-ID').format(formData.price) : ''} onChange={e=>setFormData({...formData, price: e.target.value.replace(/\D/g, '')})} className="w-full p-3 bg-white border border-slate-200 rounded-xl text-indigo-700 font-black text-sm"/></div>
                    <div><label className="block text-[10px] font-black text-slate-500 mb-1.5 uppercase">Diskon Promo</label><input type="text" value={formData.diskon ? new Intl.NumberFormat('id-ID').format(formData.diskon) : ''} onChange={e=>setFormData({...formData, diskon: e.target.value.replace(/\D/g, '')})} className="w-full p-3 bg-white border border-slate-200 rounded-xl text-pink-600 font-black text-sm" placeholder="0"/></div>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-500 mb-2">Foto Produk</label>
                    <div className="flex items-center gap-4 bg-slate-50 p-3 rounded-2xl border border-dashed">
                      {formData.image ? (
                        <div className="relative w-16 h-16 rounded-xl overflow-hidden bg-white"><img src={formData.image} crossOrigin="anonymous" className="w-full h-full object-cover"/><button type="button" onClick={() => setFormData({...formData, image: ''})} className="absolute inset-0 bg-black/60 text-white flex items-center justify-center opacity-0 hover:opacity-100"><Icon name="delete"/></button></div>
                      ) : ( <div className="w-16 h-16 rounded-xl bg-white border flex items-center justify-center text-slate-300"><Icon name="add_photo_alternate" className="text-2xl" /></div> )}
                      <div className="flex-1"><input type="file" accept="image/*" onChange={handleImageUpload} className="w-full text-sm text-slate-500"/></div>
                    </div>
                  </div>
                  <div className="flex gap-3 pt-2">
                    <button type="button" onClick={()=>setIsModalOpen(false)} className="flex-1 p-4 bg-slate-100 font-bold rounded-2xl">Batal</button>
                    <button type="submit" className="flex-[2] p-4 bg-indigo-600 text-white font-black rounded-2xl shadow-lg">SIMPAN DATA</button>
                  </div>
                </form>
              </div>
            </div>, document.body
          )}

          {isCategoryModalOpen && ReactDOM.createPortal(
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[999] flex items-center justify-center p-4">
              <div className="bg-white rounded-[2rem] w-full max-w-sm p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-6"><h3 className="text-xl font-black">Kategori</h3><button onClick={() => setIsCategoryModalOpen(false)} className="text-slate-400 bg-slate-100 p-2 rounded-full"><Icon name="close" /></button></div>
                <button onClick={addCategory} className="w-full bg-indigo-50 text-indigo-700 py-3.5 rounded-2xl font-bold flex justify-center items-center gap-2 mb-5"><Icon name="add" /> Tambah Kategori Baru</button>
                <div className="max-h-64 overflow-y-auto space-y-2.5 hide-scrollbar">
                  {categories.map(cat => (<div key={cat.id} className="flex justify-between items-center bg-slate-50 p-3.5 rounded-2xl border"><span className="font-bold text-slate-700">{cat.name}</span><button onClick={() => deleteCategory(cat.id)} className="text-red-400 hover:text-red-600 p-2"><Icon name="delete" /></button></div>))}
                </div>
              </div>
            </div>, document.body
          )}

          <CameraScanner 
            isOpen={!!isScannerOpen} 
            onClose={() => setIsScannerOpen(false)} 
            onScan={(text) => {
              if (isScannerOpen === 'form') setFormData(prev => ({...prev, barcode: text}));
            }} 
          />
        </div>
      );
    }

    // --- SUB KOMPONEN KAS & LACI TOKO ---

      const [editAmount, setEditAmount] = useState('');
      const handleUpdate = (e) => { e.preventDefault(); const val = parseInt(editAmount.replace(/\D/g, '')) || 0; const newBalances = { ...balances, kembalian: val }; setBalances(newBalances); syncToSheets('UPDATE_BALANCES', newBalances); setEditAmount(''); showAlert({ icon: 'success', title: 'Berhasil', text: 'Modal laci telah diperbarui!' }); };
      return (
        <div className="space-y-6 max-w-3xl">
          <div className="bg-white p-6 rounded-3xl border">
            <h2 className="text-2xl font-black">Kas & Modal Laci</h2>
          </div>
          <div className="bg-gradient-to-br from-indigo-500 to-indigo-700 p-8 rounded-[2.5rem] text-white shadow-2xl flex flex-col justify-between relative overflow-hidden"><Icon name="account_balance_wallet" className="absolute -right-4 -bottom-8 text-[160px] text-white/10" /><div className="relative z-10"><p className="text-indigo-100 font-bold mb-2 uppercase text-sm">Saldo Tunai Saat Ini</p><h3 className="text-4xl md:text-6xl font-black mb-1">{formatRp(balances?.kembalian || 0)}</h3></div></div>
          <div className="bg-white p-6 rounded-3xl border"><h3 className="text-xl font-bold mb-5">Set Modal Laci Pagi Hari</h3><form onSubmit={handleUpdate} className="flex flex-col sm:flex-row gap-4"><div className="relative flex-1"><span className="absolute left-5 top-1/2 -translate-y-1/2 font-black text-slate-400 text-xl">Rp</span><input required type="text" value={editAmount ? new Intl.NumberFormat('id-ID').format(editAmount.replace(/\D/g, '')) : ''} onChange={(e) => setEditAmount(e.target.value.replace(/\D/g, ''))} className="w-full pl-14 pr-5 py-4 bg-slate-50 border rounded-2xl font-black text-2xl outline-none" /></div><button type="submit" className="bg-slate-800 text-white px-10 py-4 rounded-2xl font-black">SIMPAN</button></form></div>
        </div>
      );
    }

    // --- SUB KOMPONEN PEGAWAI ---
    function AdminUsers({ users, setUsers, syncToSheets }) {
      const [isModalOpen, setIsModalOpen] = useState(false); const [formData, setFormData] = useState({});
      const openModal = (u = null) => { setFormData(u ? {...u} : { id: `USR-${Date.now()}`, kode: '', nama: '', pin: '', status: 'aktif' }); setIsModalOpen(true); };
      const handleSave = (e) => { e.preventDefault(); const payload = { ...formData }; if ((users || []).find(u => u.id === payload.id)) { setUsers(users.map(u => u.id === payload.id ? payload : u)); syncToSheets('UPDATE_USER', payload); } else { setUsers([...(users || []), payload]); syncToSheets('ADD_USER', payload); } setIsModalOpen(false); showAlert({ icon: 'success', title: 'Tersimpan!' }); };
      const delUser = (id) => { if(window.Swal) window.Swal.fire({title: 'Hapus Akses?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444'}).then((res) => { if(res.isConfirmed) { setUsers(users.filter(u=>u.id!==id)); syncToSheets('DELETE_USER', {id}); showAlert({ icon: 'success', title: 'Dihapus!' }); } }); };

      return (
        <div className="space-y-6">
          <div className="flex flex-col md:flex-row justify-between md:items-center gap-4 bg-white p-6 rounded-3xl border">
            <div><h2 className="text-2xl font-black text-slate-800">Pegawai & Akses</h2></div>
            <button onClick={() => openModal()} className="bg-indigo-600 text-white px-6 py-3.5 rounded-2xl font-bold flex items-center gap-2 shadow-lg"><Icon name="person_add" /> <span>Tambah Staff</span></button>
          </div>
          <div className="bg-white rounded-3xl border overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-sm whitespace-nowrap min-w-[600px]">
                <thead className="bg-slate-50 text-slate-500 uppercase text-[11px] font-black border-b"><tr><th className="p-5 pl-6">Peran / Posisi</th><th className="p-5">Nama Staff</th><th className="p-5">PIN</th><th className="p-5 text-center">Status</th><th className="p-5 text-center pr-6">Aksi</th></tr></thead>
                <tbody className="divide-y divide-slate-50">
                  {(users || []).map(u => (
                    <tr key={u.id} className="hover:bg-slate-50/80">
                      <td className="p-5 pl-6 font-black text-indigo-600 uppercase text-xs">{u.kode}</td><td className="p-5 font-bold text-slate-800">{u.nama}</td><td className="p-5 font-mono text-slate-500 font-bold tracking-[0.2em]">{u.pin}</td>
                      <td className="p-5 text-center"><span className={`px-3 py-1.5 rounded-lg text-[10px] font-black uppercase ${u.status === 'aktif' ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}`}>{u.status}</span></td>
                      <td className="p-5 pr-6"><div className="flex justify-center gap-2"><button onClick={()=>openModal(u)} className="p-2.5 text-indigo-600 bg-indigo-50 rounded-xl"><Icon name="edit"/></button><button onClick={()=>delUser(u.id)} className="p-2.5 text-red-500 bg-red-50 rounded-xl"><Icon name="delete"/></button></div></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
          {isModalOpen && ReactDOM.createPortal(
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[999] flex items-center justify-center p-4">
              <div className="bg-white rounded-[2rem] w-full max-w-md shadow-2xl p-6 md:p-8">
                <h3 className="text-2xl font-black mb-6 text-slate-800">{formData.nama ? 'Edit Staff' : 'Tambah Staff'}</h3>
                <form onSubmit={handleSave} className="space-y-5">
                  <div className="grid grid-cols-2 gap-4">
                    <div><label className="block text-xs font-bold text-slate-500 mb-1.5">Posisi</label><input required value={formData.kode || ''} onChange={e=>setFormData({...formData, kode: e.target.value})} className="w-full p-4 bg-slate-50 border rounded-2xl outline-none font-bold" placeholder="kasir" /></div>
                    <div><label className="block text-xs font-bold text-slate-500 mb-1.5">Nama</label><input required value={formData.nama || ''} onChange={e=>setFormData({...formData, nama: e.target.value})} className="w-full p-4 bg-slate-50 border rounded-2xl outline-none font-bold" /></div>
                  </div>
                  <div><label className="block text-xs font-bold text-slate-500 mb-1.5">PIN Rahasia (Angka)</label><input required type="text" pattern="\d*" value={formData.pin || ''} onChange={e=>setFormData({...formData, pin: e.target.value.replace(/\D/g,'')})} className="w-full p-4 bg-slate-50 border rounded-2xl text-center font-black tracking-[0.2em] text-xl" placeholder="1234" maxLength="6" /></div>
                  <div><label className="block text-xs font-bold text-slate-500 mb-1.5">Status Akun</label><select value={formData.status || 'aktif'} onChange={e=>setFormData({...formData, status: e.target.value})} className="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-slate-700"><option value="aktif">🟢 Aktif</option><option value="nonaktif">🔴 Nonaktif</option></select></div>

                </form>
              </div>
            </div>, document.body
          )}
        </div>
      );
    }

    // --- SUB KOMPONEN SETTING TOKO ---
    function AdminSettings({ storeConfig, setStoreConfig, syncToSheets }) {
      const [form, setForm] = useState(storeConfig);
      const save = (e) => { e.preventDefault(); setStoreConfig(form); syncToSheets('UPDATE_SETTINGS', form); showAlert({icon:'success', title:'Tersimpan'}); };

      const handleImageUpload = (e, key, maxWidth, maxHeight) => {
        const file = e.target.files[0]; if (!file) return; const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas'); let width = img.width; let height = img.height;
            if (width > height) { if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; } } 
            else { if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; } }
            canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d');
            ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, width, height); ctx.drawImage(img, 0, 0, width, height);
            setForm(prev => ({ ...prev, [key]: canvas.toDataURL('image/jpeg', 0.6) }));
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      return (
        <div className="bg-white p-6 md:p-8 rounded-3xl border max-w-2xl">
          <h2 className="text-2xl font-black mb-6">Profil Toko</h2>
          <form onSubmit={save} className="space-y-5">
            <div className="flex flex-col sm:flex-row items-center gap-5 p-5 bg-slate-50 border rounded-2xl">
              {form.logo ? (
                <div className="relative w-24 h-24 rounded-xl border bg-white flex items-center justify-center p-2"><img src={form.logo} crossOrigin="anonymous" className="w-full h-full object-contain"/><button type="button" onClick={() => setForm({...form, logo: ''})} className="absolute inset-0 bg-black/60 text-white flex items-center justify-center opacity-0 hover:opacity-100"><Icon name="delete"/></button></div>
              ) : ( <div className="w-24 h-24 rounded-xl bg-white border flex items-center justify-center text-slate-300"><Icon name="storefront" className="text-4xl" /></div> )}
              <div className="flex-1 w-full"><label className="block text-xs font-bold mb-2">Upload Logo Baru</label><input type="file" accept="image/*" onChange={(e) => handleImageUpload(e, 'logo', 250, 250)} className="w-full text-sm text-slate-500"/></div>
            </div>
            <div className="flex flex-col gap-4 p-5 bg-slate-50 border rounded-2xl">
              <label className="block text-xs font-bold">Upload Banner Promo Kasir (Landscape)</label>
              <input type="file" accept="image/*" onChange={(e) => handleImageUpload(e, 'banner', 800, 400)} className="w-full text-sm text-slate-500"/>
              {form.banner && ( <div className="relative w-full h-32 rounded-xl overflow-hidden"><img src={form.banner} crossOrigin="anonymous" className="w-full h-full object-cover"/><button type="button" onClick={() => setForm({...form, banner: ''})} className="absolute top-2 right-2 p-2 bg-red-500 text-white rounded-lg shadow"><Icon name="delete" className="text-sm"/></button></div> )}
            </div>
            <div><label className="block text-xs font-bold mb-1.5">Nama Usaha / Toko</label><input required type="text" value={form.name || ''} onChange={e=>setForm({...form, name:e.target.value})} className="w-full p-4 bg-slate-50 border rounded-2xl outline-none font-bold"/></div>
            <div><label className="block text-xs font-bold mb-1.5">Alamat Lengkap</label><textarea required rows="2" value={form.address || ''} onChange={e=>setForm({...form, address:e.target.value})} className="w-full p-4 bg-slate-50 border rounded-2xl outline-none resize-none"/></div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
              <div><label className="block text-xs font-bold mb-1.5">Kontak (Telp / WA)</label><input required type="text" value={form.phone || ''} onChange={e=>setForm({...form, phone:e.target.value})} className="w-full p-4 bg-slate-50 border rounded-2xl outline-none font-bold"/></div>
              <div><label className="block text-xs font-bold mb-1.5">Pesan Penutup (Footer)</label><input required type="text" value={form.footer || ''} onChange={e=>setForm({...form, footer:e.target.value})} className="w-full p-4 bg-slate-50 border rounded-2xl outline-none"/></div>
            </div>
            <button type="submit" className="w-full bg-slate-800 text-white p-4 rounded-2xl font-black mt-4 flex justify-center items-center gap-2"><Icon name="save" /> SIMPAN PERUBAHAN</button>
          </form>
        </div>
      )
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
