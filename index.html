<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>KassQu</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/png" href="logo.png?v=2" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { margin: 0; padding: 0; background-color: #f8fafc; font-family: 'Segoe UI', sans-serif; overscroll-behavior-y: none; }
    .full-immersive {
      position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: 50;
      background-image: url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5?q=80&w=1974&auto=format&fit=crop');
      background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none;
    }
    .full-immersive::before { content: ""; position: absolute; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(2px); z-index: -1; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    @media print {
      @page { size: 58mm auto; margin: 0; }
      body > * { display: none !important; }
      #print-clone { display: block !important; width: 58mm !important; padding: 2mm !important; background: white !important; font-family: monospace !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx5X0YbLUu0y0aEZ2pZPPjX9IeZrVkgMxnKvQG-FojOHTrqA__ltD9wF8OwZEqmzg3s/exec";
    const formatRp = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(n);
    const Icon = ({ name, className = "" }) => <span className={`material-symbols-outlined ${className}`}>{name}</span>;
    const showAlert = (opt) => window.Swal ? window.Swal.fire(opt) : alert(opt.title);

    function App() {
      const [userRole, setUserRole] = useState(null);
      const [loading, setLoading] = useState(true);
      const [products, setProducts] = useState([]);
      const [categories, setCategories] = useState([]);
      const [transactions, setTransactions] = useState([]);
      const [balances, setBalances] = useState({ kembalian: 0 });
      const [users, setUsers] = useState([]);
      const [storeConfig, setStoreConfig] = useState({ name: 'KassQu', address: 'Alamat', phone: '0812', footer: 'Terima Kasih', logo: 'logo.png' });

      const syncToSheets = async (action, data) => {
        try {
          await fetch(APP_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ action, data, timestamp: new Date().toISOString() })
          });
        } catch (e) { console.error(e); }
      };

      useEffect(() => {
        const savedRole = localStorage.getItem('kassqu_role');
        if (savedRole) setUserRole(savedRole);
        const loadData = async () => {
          try {
            const res = await fetch(APP_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'GET_INITIAL_DATA' }) });
            const result = await res.json();
            if (result.status === 'success') {
              setProducts(result.data.products || []);
              setCategories(result.data.categories || []);
              setTransactions(result.data.transactions || []);
              setBalances(result.data.balances || { kembalian: 0 });
              setStoreConfig(result.data.storeConfig || storeConfig);
              setUsers(result.data.users || []);
            }
          } catch (e) { console.error(e); }
          finally { setLoading(false); }
        };
        loadData();
      }, []);

      if (loading) return (
        <div className="full-immersive flex-col text-white">
          <div className="w-16 h-16 border-4 border-indigo-500 border-t-white rounded-full animate-spin mb-6"></div>
          <h1 className="text-4xl font-black tracking-widest">KASSQU</h1>
        </div>
      );

      if (!userRole) return <LoginScreen onLogin={(r) => { setUserRole(r); localStorage.setItem('kassqu_role', r); }} storeConfig={storeConfig} users={users} />;

      return (
        <div className="min-h-[100dvh] bg-slate-50 overflow-hidden">
          {userRole === 'kasir' ? (
            <KasirDashboard products={products} categories={categories} storeConfig={storeConfig} transactions={transactions} onLogout={() => { setUserRole(null); localStorage.removeItem('kassqu_role'); }} 
              onTransactionSuccess={(trx) => { 
                setTransactions(p => [trx, ...p]); 
                syncToSheets('ADD_TRANSACTION', trx); 
                if(trx.method === 'Cash') {
                  const nb = { ...balances, kembalian: (balances.kembalian || 0) + trx.total };
                  setBalances(nb); syncToSheets('UPDATE_BALANCES', nb);
                }
              }} 
            />
          ) : (
            <AdminDashboard products={products} setProducts={setProducts} categories={categories} setCategories={setCategories} transactions={transactions} storeConfig={storeConfig} setStoreConfig={setStoreConfig} balances={balances} setBalances={setBalances} users={users} setUsers={setUsers} onLogout={() => { setUserRole(null); localStorage.removeItem('kassqu_role'); }} syncToSheets={syncToSheets} />
          )}
        </div>
      );
    }

    function LoginScreen({ onLogin, storeConfig, users }) {
      const [role, setRole] = useState('kasir');
      const [pin, setPin] = useState('');
      const handleLogin = (e) => {
        e.preventDefault();
        const matched = users.find(u => String(u.pin).trim() === pin.trim() && u.status === 'aktif');
        if (matched && matched.kode.toLowerCase().includes(role)) onLogin(role);
        else showAlert({ icon: 'error', title: 'Akses Ditolak', text: 'PIN salah atau peran tidak sesuai!' });
      };
      return (
        <div className="full-immersive p-4">
          <div className="bg-white/95 backdrop-blur-xl rounded-[2rem] shadow-2xl w-full max-w-sm p-8 text-center animate-fade-in">
            <div className="w-20 h-20 mx-auto mb-4 bg-indigo-600 rounded-2xl flex items-center justify-center text-white">
               <Icon name="point_of_sale" className="text-4xl" />
            </div>
            <h1 className="text-3xl font-black mb-6 uppercase">{storeConfig.name}</h1>
            <form onSubmit={handleLogin} className="space-y-6">
              <div className="flex bg-slate-100 p-1 rounded-xl">
                <button type="button" onClick={() => setRole('kasir')} className={`flex-1 py-3 rounded-lg font-bold ${role === 'kasir' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-400'}`}>KASIR</button>
                <button type="button" onClick={() => setRole('admin')} className={`flex-1 py-3 rounded-lg font-bold ${role === 'admin' ? 'bg-red-500 text-white shadow-sm' : 'text-slate-400'}`}>ADMIN</button>
              </div>
              <input type="password" value={pin} onChange={e => setPin(e.target.value)} placeholder="Masukkan PIN" className="w-full px-6 py-4 rounded-2xl bg-slate-50 border-2 border-white focus:border-indigo-500 outline-none text-center text-2xl font-mono tracking-widest" />
              <button type="submit" className="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black text-lg active:scale-95 shadow-lg shadow-indigo-100">MASUK</button>
            </form>
          </div>
        </div>
      );
    }

    function KasirDashboard({ products, categories, storeConfig, transactions, onLogout, onTransactionSuccess }) {
      const [cart, setCart] = useState([]);
      const [showPayment, setShowPayment] = useState(false);
      const [paymentMethod, setPaymentMethod] = useState('Cash');
      const [searchQuery, setSearchQuery] = useState('');
      const [paymentAmount, setPaymentAmount] = useState('');
      const [activeCategory, setActiveCategory] = useState('Semua');
      const [lastInvoice, setLastInvoice] = useState(null);
      const [isMobileCartOpen, setIsMobileCartOpen] = useState(false);
      const [showHistory, setShowHistory] = useState(false);

      const filtered = useMemo(() => products.filter(p => (activeCategory === 'Semua' || p.category === activeCategory) && p.name.toLowerCase().includes(searchQuery.toLowerCase())), [products, activeCategory, searchQuery]);
      const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);

      const addToCart = (p) => {
        if (p.stock <= 0) return showAlert({ icon: 'error', title: 'Habis' });
        setCart(prev => {
          const ex = prev.find(i => i.id === p.id);
          if (ex) return prev.map(i => i.id === p.id ? { ...i, qty: i.qty + 1 } : i);
          return [...prev, { ...p, price: p.price - (p.diskon || 0), qty: 1 }];
        });
      };

      const processPayment = () => {
        const bayar = paymentMethod === 'Cash' ? (parseInt(paymentAmount) || 0) : total;
        if (bayar < total) return showAlert({ icon: 'error', title: 'Uang Kurang' });
        const trx = { id: `INV-${Date.now().toString().slice(-6)}`, date: new Date().toISOString(), items: cart, total: total, payment: bayar, change: bayar - total, method: paymentMethod };
        setLastInvoice(trx); onTransactionSuccess(trx); setCart([]); setShowPayment(false);
      };

      return (
        <div className="flex h-[100dvh] overflow-hidden bg-slate-100">
          <div className="flex-1 flex flex-col overflow-hidden relative">
            <div className="bg-indigo-700 text-white pb-4 shrink-0 shadow-md z-10">
              <div className="px-4 py-3 flex justify-between items-center">
                <div className="flex items-center gap-2"><Icon name="point_of_sale" /><h2 className="font-black text-xl uppercase tracking-tighter">{storeConfig.name}</h2></div>
                <div className="flex gap-2">
                  <button onClick={() => setShowHistory(true)} className="p-2 bg-white/10 rounded-full"><Icon name="history" /></button>
                  <button onClick={onLogout} className="p-2 bg-white/10 rounded-full"><Icon name="logout" /></button>
                </div>
              </div>
              <div className="px-4"><input type="text" placeholder="Cari produk..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="w-full p-3 rounded-xl text-slate-800 outline-none" /></div>
              <div className="px-4 mt-3 flex gap-2 overflow-x-auto hide-scrollbar">
                {['Semua', ...categories.map(c => c.name)].map(cat => (
                  <button key={cat} onClick={() => setActiveCategory(cat)} className={`px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap ${activeCategory === cat ? 'bg-white text-indigo-700' : 'bg-indigo-500 text-white'}`}>{cat}</button>
                ))}
              </div>
            </div>
            <div className="flex-1 overflow-y-auto p-4 grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-3">
              {filtered.map(p => (
                <div key={p.id} onClick={() => addToCart(p)} className="bg-white p-3 rounded-2xl shadow-sm active:scale-95 transition-all">
                  <img src={p.image || 'https://via.placeholder.com/150'} className="aspect-square object-cover rounded-xl mb-2" />
                  <h4 className="font-bold text-sm h-10 line-clamp-2">{p.name}</h4>
                  <div className="text-indigo-600 font-black mt-1">{formatRp(p.price - (p.diskon || 0))}</div>
                </div>
              ))}
            </div>
            {cart.length > 0 && (
              <button onClick={() => setIsMobileCartOpen(true)} className="md:hidden fixed bottom-6 right-6 w-16 h-16 bg-indigo-600 text-white rounded-full shadow-2xl flex items-center justify-center z-40">
                <Icon name="shopping_cart" /><span className="absolute top-0 right-0 bg-red-500 w-6 h-6 rounded-full text-xs flex items-center justify-center border-2 border-white">{cart.length}</span>
              </button>
            )}
          </div>
          <div className={`${isMobileCartOpen ? 'fixed inset-0 z-50 flex' : 'hidden md:flex'} w-full md:w-80 bg-white flex-col border-l`}>
             <div className="p-4 bg-indigo-600 text-white flex justify-between items-center md:bg-white md:text-slate-800">
                <h3 className="font-black flex items-center gap-2"><Icon name="shopping_basket" /> KERANJANG</h3>
                {isMobileCartOpen && <button onClick={() => setIsMobileCartOpen(false)}><Icon name="close" /></button>}
             </div>
             <div className="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50">
               {cart.map(item => (
                 <div key={item.id} className="bg-white p-3 rounded-xl flex justify-between shadow-sm">
                   <div className="flex-1">
                     <div className="font-bold text-xs">{item.name}</div>
                     <div className="text-indigo-600 font-bold">{formatRp(item.price)} x {item.qty}</div>
                   </div>
                   <button onClick={() => setCart(cart.filter(i => i.id !== item.id))} className="text-red-400"><Icon name="delete" /></button>
                 </div>
               ))}
             </div>
             <div className="p-5 bg-white border-t">
               <div className="flex justify-between mb-4"><span className="font-bold text-slate-400 text-sm uppercase">Total Tagihan</span><span className="text-2xl font-black">{formatRp(total)}</span></div>
               <button onClick={() => setShowPayment(true)} className="w-full bg-indigo-600 text-white py-4 rounded-xl font-black text-lg">BAYAR</button>
             </div>
          </div>
          {showPayment && (
            <div className="fixed inset-0 bg-slate-900/60 z-[60] flex items-center justify-center p-4 backdrop-blur-sm">
               <div className="bg-white p-6 rounded-[2rem] w-full max-w-sm">
                 <h3 className="text-xl font-bold mb-4">Pembayaran</h3>
                 <div className="bg-indigo-50 p-6 rounded-2xl text-center mb-6">
                    <p className="text-xs font-bold text-indigo-400">TOTAL</p>
                    <div className="text-3xl font-black text-indigo-700">{formatRp(total)}</div>
                 </div>
                 <div className="grid grid-cols-3 gap-2 mb-4">
                   {['Cash', 'QRIS', 'Transfer'].map(m => <button key={m} onClick={() => setPaymentMethod(m)} className={`py-2 rounded-lg font-bold border-2 ${paymentMethod === m ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-100'}`}>{m}</button>)}
                 </div>
                 {paymentMethod === 'Cash' && <input type="number" value={paymentAmount} onChange={e => setPaymentAmount(e.target.value)} placeholder="Jumlah bayar" className="w-full p-4 bg-slate-50 rounded-xl mb-4 text-center text-2xl font-black border-2 border-indigo-100" />}
                 <button onClick={processPayment} className="w-full bg-emerald-500 text-white py-4 rounded-xl font-black text-lg">PROSES</button>
                 <button onClick={() => setShowPayment(false)} className="w-full mt-3 text-slate-400 font-bold">Batal</button>
               </div>
            </div>
          )}
          {lastInvoice && (
             <div className="fixed inset-0 bg-white z-[70] flex flex-col p-6 items-center">
                <div id="print-invoice" className="w-full max-w-[58mm] font-mono text-xs border p-4 text-center">
                  <h2 className="font-bold text-base">{storeConfig.name}</h2>
                  <div className="border-b border-dashed my-2"></div>
                  {lastInvoice.items.map(i => <div key={i.id} className="flex justify-between"><span>{i.qty}x {i.name}</span><span>{formatRp(i.price * i.qty)}</span></div>)}
                  <div className="border-b border-dashed my-2"></div>
                  <div className="flex justify-between font-bold"><span>TOTAL</span><span>{formatRp(lastInvoice.total)}</span></div>
                </div>
                <div className="mt-8 flex gap-3">
                  <button onClick={() => window.print()} className="bg-indigo-600 text-white px-8 py-3 rounded-xl font-black">CETAK</button>
                  <button onClick={() => setLastInvoice(null)} className="bg-slate-200 px-8 py-3 rounded-xl font-bold">TUTUP</button>
                </div>
             </div>
          )}
        </div>
      );
    }

    function AdminDashboard({ products, setProducts, categories, setCategories, transactions, storeConfig, setStoreConfig, balances, setBalances, users, setUsers, onLogout, syncToSheets }) {
      const [activeTab, setActiveTab] = useState('report');
      const tabs = [
        { id: 'report', label: 'Laporan', icon: 'monitoring' },
        { id: 'products', label: 'Produk', icon: 'inventory_2' },
        { id: 'balances', label: 'Kas', icon: 'payments' },
        { id: 'users', label: 'Pegawai', icon: 'group' },
        { id: 'settings', label: 'Toko', icon: 'settings' }
      ];
      return (
        <div className="flex h-[100dvh] w-full overflow-hidden flex-col md:flex-row">
          <aside className="w-full md:w-64 bg-slate-900 text-white flex flex-col shrink-0">
            <div className="p-4 md:p-6 border-b border-slate-800 flex justify-between items-center">
              <h2 className="text-lg font-black tracking-widest truncate">ADMIN</h2>
              <button onClick={onLogout} className="md:hidden text-red-400"><Icon name="logout" /></button>
            </div>
            <nav className="flex md:flex-col p-2 md:p-4 gap-1 overflow-x-auto hide-scrollbar">
              {tabs.map(t => (
                <button key={t.id} onClick={() => setActiveTab(t.id)} className={`flex items-center gap-2 px-4 py-3 rounded-xl whitespace-nowrap ${activeTab === t.id ? 'bg-indigo-600' : 'text-slate-400'}`}>
                  <Icon name={t.icon} /> <span className="font-bold text-sm hidden md:inline">{t.label}</span>
                </button>
              ))}
            </nav>
          </aside>
          <main className="flex-1 overflow-y-auto p-4 md:p-8">
            <h1 className="text-2xl font-black mb-6 uppercase">{activeTab}</h1>
            <p className="italic text-slate-400">Halaman ini siap dikelola sesuai kebutuhan Anda.</p>
          </main>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
