<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kedai-DemoApp</title>
  
  <!-- Web App Manifest & PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" type="image/png" href="https://via.placeholder.com/64/4f46e5/ffffff?text=KQ" />
  <link rel="apple-touch-icon" href="https://via.placeholder.com/192/4f46e5/ffffff?text=KQ">
  
  <!-- SCRIPT PWA MANIFEST (KHUSUS ANDROID/CHROME) -->
  <script>
    (function() {
      // Membuat KTP Aplikasi (Manifest) secara virtual
      const manifestJSON = {
        "name": "KassQu Kedai-DemoApp",
        "short_name": "Kedai-DemoApp",
        "start_url": window.location.href, 
        "display": "standalone",
        "background_color": "#f8fafc",
        "theme_color": "#4f46e5",
        "icons": [
          {
            "src": "https://raw.githubusercontent.com/kassqu/DemoApp1/refs/heads/main/logo.png",
            "sizes": "192x192",
            "type": "image/png",
            "purpose": "any maskable"
          },
          {
            "src": "https://raw.githubusercontent.com/kassqu/DemoApp1/refs/heads/main/logo.png",
            "sizes": "512x512",
            "type": "image/png",
            "purpose": "any maskable"
          }
        ]
      };
      
      // Mengubah JSON menjadi URL Data dan menempelkannya ke <head>
      const manifestString = JSON.stringify(manifestJSON);
      const manifestURL = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(manifestString);
      
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = manifestURL;
      document.head.appendChild(link);
    })();
  </script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>

  <!-- Google Material Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <!-- jsPDF & AutoTable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    body {
      height: 100%; margin: 0; padding: 0;
      background-color: #f8fafc;
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overscroll-behavior-y: none;
      -webkit-font-smoothing: antialiased;
    }
    
    .scroll-momentum {
      -webkit-overflow-scrolling: touch;
    }
    
    /* Background Immersive untuk Layar Login */
    .full-immersive {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100vw; height: 100%;
      z-index: 50;
      background-image: url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5?q=80&w=1974&auto=format&fit=crop');
      background-size: cover; background-position: center; background-repeat: no-repeat;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; touch-action: none;
    }
    .full-immersive::before {
      content: ""; position: absolute; inset: 0;
      background: rgba(15, 23, 42, 0.35); 
      backdrop-filter: blur(2px);
      z-index: -1;
    }

    /* Kustom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }

    /* CSS Khusus Cetak Struk Thermal */
    @media print {
      #root, .no-print { display: none !important; }
      body { background: white !important; margin: 0 !important; padding: 0 !important; }
      
      #print-clone {
        display: block !important;
        position: static !important;
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important; 
        padding: 0 !important;
        border: none !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        overflow: visible !important;
      }
      #print-clone * { color: black !important; background: transparent !important; }
      @page { margin: 0; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- KONFIGURASI APP ---
    const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx5X0YbLUu0y0aEZ2pZPPjX9IeZrVkgMxnKvQG-FojOHTrqA__ltD9wF8OwZEqmzg3s/exec";

    // Format Rupiah
    const formatRp = (number) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number || 0);
    
    // Icon Component
    const Icon = ({ name, className = "" }) => <span className={`material-symbols-outlined ${className}`}>{name}</span>;
    
    // Wrapper SweetAlert2 yang aman (tanpa alert native)
    const showAlert = (options) => {
      if (window.Swal) {
        return window.Swal.fire({
          ...options,
          confirmButtonColor: '#4f46e5',
          borderRadius: '1rem'
        });
      } else {
        console.warn('Swal not loaded:', options.title);
      }
    };

    // ==========================================
    // APP CONTAINER
    // ==========================================
    function App() {
      const [userRole, setUserRole] = useState(null);
      const [loading, setLoading] = useState(true);
      const [products, setProducts] = useState([]);
      const [categories, setCategories] = useState([]);
      const [transactions, setTransactions] = useState([]);
      const [balances, setBalances] = useState({ kembalian: 0 });
      const [users, setUsers] = useState([]); 
      
      const [storeConfig, setStoreConfig] = useState({ 
        name: 'KassQu', 
        address: 'Pusat Perbelanjaan', 
        phone: '0812345678', 
        footer: 'Terima Kasih Atas Kunjungan Anda',
        logo: ''
      });

      const syncToGoogleSheets = async (action, data) => {
        try {
          // Asinkron di-background, jangan menghalangi UI
          fetch(APP_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action, data, timestamp: new Date().toISOString() })
          }).catch(err => console.error("Sync fetch error:", err));
        } catch (error) { 
          console.error("Sync Error:", error); 
        }
      };
      
      useEffect(() => {
        const savedRole = localStorage.getItem('kassqu_role');
        if (savedRole) setUserRole(savedRole);

        const loadData = async () => {
          try {
            const res = await fetch(APP_SCRIPT_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: 'GET_INITIAL_DATA' })
            });
            const result = await res.json();
            if (result.status === 'success') {
              setProducts(result.data.products || []);
              setCategories(result.data.categories || []);
              setTransactions(result.data.transactions || []);
              if (result.data.balances) setBalances(result.data.balances);
              if (result.data.storeConfig) setStoreConfig(result.data.storeConfig);
              if (result.data.users) setUsers(result.data.users); 
            }
          } catch (e) { 
            console.error("Load Error (Bisa karena internet atau URL tidak valid):", e); 
            // Tetap masuk aplikasi meski gagal fetch data awal (biar bisa jalan offline dengan dummy data jika diperlukan)
          } finally { 
            setLoading(false); 
          }
        };
        loadData();
      }, []);

      const handleLoginSuccess = (role) => {
        setUserRole(role);
        localStorage.setItem('kassqu_role', role);
      };

      const handleLogout = () => {
        if(window.Swal) {
          window.Swal.fire({
            title: 'Keluar Sistem?',
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Ya, Keluar',
            cancelButtonText: 'Batal',
            confirmButtonColor: '#ef4444'
          }).then((res) => {
            if(res.isConfirmed) {
              setUserRole(null);
              localStorage.removeItem('kassqu_role');
            }
          });
        } else {
          setUserRole(null);
          localStorage.removeItem('kassqu_role');
        }
      };

      if (loading) return (
        <div className="full-immersive flex-col text-white overscroll-none select-none">
          <div className="w-16 h-16 border-4 border-indigo-500 border-t-white rounded-full animate-spin mb-6 shadow-xl"></div>
          
          <div className="flex items-center gap-3">
            <div className="bg-indigo-600 w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-500/50">
              <Icon name="point_of_sale" className="text-white text-3xl" />
            </div>
            <h1 className="text-4xl font-black tracking-widest drop-shadow-md">KASSQU</h1>
          </div>
          
          <p className="text-sm font-medium opacity-80 mt-4 tracking-wide">Menyiapkan toko Anda...</p>
        </div>
      );
      
      if (!userRole) return <LoginScreen onLogin={handleLoginSuccess} storeConfig={storeConfig} users={users} />;

      return (
        <div className="min-h-screen bg-slate-50 font-sans text-slate-800 selection:bg-indigo-200">
          {userRole === 'kasir' ? (
            <KasirDashboard 
              products={products} categories={categories} storeConfig={storeConfig}
              transactions={transactions}
              onLogout={handleLogout}
              onTransactionSuccess={(trx) => {
                setTransactions(prev => [trx, ...prev]);
                syncToGoogleSheets('ADD_TRANSACTION', trx);
                if (trx.method === 'Cash') {
                  setBalances(prev => {
                    const nb = { ...prev, kembalian: (prev.kembalian || 0) + trx.total };
                    syncToGoogleSheets('UPDATE_BALANCES', nb);
                    return nb;
                  });
                }
              }}
              onDeleteTransaction={(id) => {
                setTransactions(prev => prev.filter(t => t.id !== id));
                syncToGoogleSheets('DELETE_TRANSACTION', { id });
              }}
            />
          ) : (
            <AdminDashboard 
              products={products} setProducts={setProducts} 
              categories={categories} setCategories={setCategories}
              transactions={transactions} storeConfig={storeConfig} setStoreConfig={setStoreConfig}
              balances={balances} setBalances={setBalances}
              users={users} setUsers={setUsers}
              onLogout={handleLogout} syncToSheets={syncToGoogleSheets}
            />
          )}
        </div>
      );
    }

    // ==========================================
    // 1. LAYAR LOGIN
    // ==========================================
    function LoginScreen({ onLogin, storeConfig, users }) {
      const [role, setRole] = useState('kasir');
      const [pin, setPin] = useState('');

      const handleLogin = async (e) => {
        e.preventDefault();
        const inputPin = pin.trim();
        const selectedRole = role.toLowerCase();

        if (!inputPin) return showAlert({ icon: 'warning', title: 'Perhatian', text: 'Masukkan PIN!' });

        // 1. CEK DATA LOKAL DULU
        if (users && users.length > 0) {
          const matchedUser = users.find(u => 
            String(u.pin).trim() === inputPin && 
            String(u.status).trim().toLowerCase() === 'aktif'
          );
          
          if (matchedUser) {
            const userRoleDb = matchedUser.kode.toLowerCase().trim();
            if (userRoleDb.includes(selectedRole)) {
              return onLogin(role); 
            } else {
              return showAlert({ icon: 'error', title: 'Akses Ditolak', text: `Akses ditolak! PIN ini terdaftar untuk ${userRoleDb.toUpperCase()}.` });
            }
          } else {
            return showAlert({ icon: 'error', title: 'PIN Salah', text: 'PIN yang Anda masukkan salah atau belum terdaftar!' });
          }
        }

        // 2. JALUR SERVER (Fallback)
        if(window.Swal) {
          window.Swal.fire({ title: 'Memverifikasi server...', allowOutsideClick: false, didOpen: () => window.Swal.showLoading() });
        }
        
        try {
          const response = await fetch(APP_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'CHECK_LOGIN', data: { cashierCode: role.toUpperCase(), pin: inputPin } })
          });
          const result = await response.json();

          if (result && result.valid) {
            if (window.Swal) window.Swal.close();
            onLogin(role);
          } else {
            showAlert({ icon: 'error', title: 'Akses Ditolak', text: 'PIN salah atau tidak terdaftar di server!' });
          }
        } catch (err) {
          showAlert({ icon: 'error', title: 'Koneksi Gagal', text: 'Gagal terhubung ke server. Pastikan internet Anda aktif atau gunakan PIN master jika darurat.' });
        }
      };

      return (
        <div className="full-immersive p-4 overscroll-none select-none">
          {/* Efek Kaca / Glassmorphism Container */}
          <div className="bg-white/10 backdrop-blur-md border border-white/20 rounded-[2.5rem] shadow-[0_8px_32px_0_rgba(0,0,0,0.3)] w-full max-w-sm p-8 text-center transform transition-all hover:scale-[1.01] duration-300 relative overflow-hidden">
            
            {/* Aksen cahaya halus di pojok kiri atas biar lebih kerasa 3D glass-nya */}
            <div className="absolute -top-20 -left-20 w-48 h-48 bg-white/20 rounded-full blur-3xl pointer-events-none"></div>

            {storeConfig?.logo ? (
               <div className="relative z-10 w-24 h-24 mx-auto mb-5 rounded-[1.5rem] shadow-xl overflow-hidden bg-white flex items-center justify-center p-2 border border-white/50">
                 <img src={storeConfig.logo} alt="Logo" className="w-full h-full object-contain" />
               </div>
            ) : (
              <div className="relative z-10 bg-white/20 border border-white/30 backdrop-blur-sm w-20 h-20 rounded-[1.5rem] flex items-center justify-center mx-auto mb-5 shadow-xl">
                <Icon name="point_of_sale" className="text-white text-4xl" />
              </div>
            )}
            <h1 className="relative z-10 text-3xl font-black text-white tracking-tight mb-1 drop-shadow-md">{storeConfig?.name || 'KassQu'}</h1>
            <p className="relative z-10 text-white/80 text-sm font-medium mb-8 drop-shadow-sm">Masuk untuk melanjutkan</p>

            <form onSubmit={handleLogin} className="space-y-6 relative z-10">
              <div className="flex bg-white p-1.5 rounded-[1.25rem] shadow-sm">
                <button type="button" onClick={() => setRole('kasir')} className={`flex-1 py-3.5 rounded-xl font-bold transition-all duration-300 ${role === 'kasir' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-600'}`}>KASIR</button>
                <button type="button" onClick={() => setRole('admin')} className={`flex-1 py-3.5 rounded-xl font-bold transition-all duration-300 ${role === 'admin' ? 'bg-red-500 text-white shadow-md' : 'text-slate-400 hover:text-slate-600'}`}>ADMIN</button>
              </div>

              <div>
                <input 
                  type="password" 
                  value={pin} 
                  onChange={(e) => setPin(e.target.value)} 
                  placeholder="Masukkan PIN" 
                  required 
                  className="w-full px-6 py-4 rounded-2xl bg-white text-slate-800 placeholder-slate-400 focus:border-indigo-300 focus:ring-4 focus:ring-indigo-100 outline-none transition-all text-center text-base font-medium shadow-sm border border-transparent" 
                />
              </div>
              <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-2xl font-bold shadow-lg shadow-indigo-600/30 transition-all active:scale-95 text-lg flex items-center justify-center gap-2">
                Masuk Aplikasi
              </button>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // 2. DASHBOARD KASIR
    // ==========================================
    function KasirDashboard({ products, categories, storeConfig, transactions, onLogout, onTransactionSuccess, onDeleteTransaction }) {
      const [cart, setCart] = useState([]);
      const [showPayment, setShowPayment] = useState(false);
      const [paymentMethod, setPaymentMethod] = useState('Cash');
      const [searchQuery, setSearchQuery] = useState('');
      const [paymentAmount, setPaymentAmount] = useState('');
      const [activeCategory, setActiveCategory] = useState('Semua');
      const [lastInvoice, setLastInvoice] = useState(null);
      const [isMobileCartOpen, setIsMobileCartOpen] = useState(false);
      const [showHistory, setShowHistory] = useState(false);
      const [currentQueueNo, setCurrentQueueNo] = useState(null);
      const [noteModal, setNoteModal] = useState({ isOpen: false, product: null, note: '' });

      // Reset queue number if cart is emptied manually
      useEffect(() => {
        if (cart.length === 0 && currentQueueNo) {
          setCurrentQueueNo(null);
        }
      }, [cart.length, currentQueueNo]);

      // Fungsi Generate Nomor Antrean (Reset Tiap Hari)
      const generateQueueNo = () => {
        const today = new Date().toDateString();
        const todayTrx = transactions.filter(t => new Date(t.date).toDateString() === today);
        return (todayTrx.length + 1).toString().padStart(3, '0');
      };

      // Filter produk berdasarkan pencarian & kategori
      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          const matchCat = activeCategory === 'Semua' || p.category === activeCategory;
          const matchSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
          return matchCat && matchSearch;
        });
      }, [products, activeCategory, searchQuery]);

      const openNoteModal = (product) => {
        if (product.stock <= 0) return showAlert({ icon: 'error', title: 'Habis', text: 'Stok barang kosong!' });
        setNoteModal({ isOpen: true, product, note: '' });
      };

      const addToCart = (product, note = '') => {
        const cartItemId = note ? `${product.id}-${note.toLowerCase().trim()}` : product.id;
        
        setCart(prev => {
          const existing = prev.find(item => (item.cartItemId || item.id) === cartItemId);
          if (existing) {
            if (existing.qty >= product.stock) {
              showAlert({ icon: 'warning', title: 'Batas Maksimal', text: 'Stok maksimal telah tercapai.' });
              return prev;
            }
            return prev.map(item => (item.cartItemId || item.id) === cartItemId ? { ...item, qty: item.qty + 1 } : item);
          }
          const netPrice = product.price - (product.diskon || 0);
          return [...prev, { ...product, cartItemId, note, price: netPrice, originalPrice: product.price, qty: 1, diskon: product.diskon || 0 }];
        });
      };

      const updateQty = (cartItemId, delta) => {
        setCart(prev => prev.map(item => {
          if ((item.cartItemId || item.id) === cartItemId) return { ...item, qty: Math.max(1, item.qty + delta) };
          return item;
        }));
      };

      const removeFromCart = (cartItemId) => setCart(prev => prev.filter(item => (item.cartItemId || item.id) !== cartItemId));
      
      const totalBelanja = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      // Proses untuk masukin pesanan ke Antrean (Tanpa/Belum dibayar)
      const processQueueOnly = () => {
        const transactionData = { 
          id: `INV-${Date.now().toString().slice(-6)}`, 
          queueNo: currentQueueNo || generateQueueNo(),
          date: new Date().toISOString(), 
          items: cart, 
          total: totalBelanja, 
          payment: 0, 
          change: 0,
          method: 'Belum Bayar'
        };
        
        setLastInvoice(transactionData);
        onTransactionSuccess(transactionData);
        setCart([]); setIsMobileCartOpen(false);
        setCurrentQueueNo(null);
      };

      // Proses untuk pesanan yang langsung Lunas/Dibayar
      const processPayment = () => {
        const bayar = paymentMethod === 'Cash' ? (parseInt(paymentAmount.replace(/\D/g, '')) || 0) : totalBelanja;
        
        if (paymentMethod === 'Cash' && bayar < totalBelanja) {
          return showAlert({ icon: 'error', title: 'Uang Kurang!', text: 'Nominal pembayaran tidak mencukupi.' });
        }
        
        const transactionData = { 
          id: `INV-${Date.now().toString().slice(-6)}`, 
          queueNo: currentQueueNo || generateQueueNo(),
          date: new Date().toISOString(), 
          items: cart, 
          total: totalBelanja, 
          payment: bayar, 
          change: bayar - totalBelanja,
          method: paymentMethod
        };
        
        setLastInvoice(transactionData);
        onTransactionSuccess(transactionData);
        setCart([]); setShowPayment(false); setIsMobileCartOpen(false);
        setCurrentQueueNo(null);
      };

      const resumeTransaction = (trx) => {
        const executeResume = () => {
          setCart(trx.items);
          setCurrentQueueNo(trx.queueNo);
          onDeleteTransaction(trx.id);
          setShowHistory(false);
        };

        if (cart.length > 0) {
          if (window.Swal) {
            window.Swal.fire({
              title: 'Ganti Pesanan Aktif?',
              text: 'Keranjang saat ini tidak kosong. Ganti dengan pesanan antrean ini?',
              icon: 'warning',
              showCancelButton: true,
              confirmButtonColor: '#4f46e5',
              confirmButtonText: 'Ya, Ganti',
              cancelButtonText: 'Batal'
            }).then((res) => {
              if (res.isConfirmed) executeResume();
            });
          } else {
            executeResume();
          }
        } else {
          executeResume();
        }
      };

      const handlePrint = () => {
        const clone = document.getElementById('print-invoice').cloneNode(true);
        clone.id = 'print-clone'; 
        document.body.appendChild(clone);
        setTimeout(() => { 
          window.print(); 
          setTimeout(() => {
            const cloneEl = document.getElementById('print-clone');
            if(cloneEl) cloneEl.remove();
          }, 1000); 
        }, 300);
      };

      const handleDownloadImage = async () => {
        const element = document.getElementById('print-invoice');
        if (!element) return;
        try {
          const canvas = await html2canvas(element, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
          const dataUrl = canvas.toDataURL('image/png');
          const link = document.createElement('a');
          link.download = `Struk-${lastInvoice.id}.png`;
          link.href = dataUrl;
          link.click();
        } catch (err) {
          console.error(err);
          showAlert({ icon: 'error', title: 'Gagal', text: 'Gagal menyimpan gambar struk.' });
        }
      };

      const handleShareWA = async () => {
        const element = document.getElementById('print-invoice');
        if (!element) return;
        
        try {
          const canvas = await html2canvas(element, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
          canvas.toBlob(async (blob) => {
            if (!blob) return;
            const file = new File([blob], `Struk-${lastInvoice.id}.png`, { type: 'image/png' });
            
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              await navigator.share({
                files: [file],
                title: `Struk Transaksi ${lastInvoice.id}`,
                text: `Terima kasih telah berbelanja di ${storeConfig.name}!`,
              });
            } else {
              handleDownloadImage(); 
              showAlert({ 
                icon: 'info', 
                title: 'Share Manual',

    // --- KOMPONEN PIE CHART (SAFE INSTANCE) ---
    function PieChart({ data, labels, title, colors, isCurrency = false }) {
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      useEffect(() => {
        if (chartInstance.current) {
          chartInstance.current.destroy();
        }
        
        if (!chartRef.current || !window.Chart) return;

        const ctx = chartRef.current.getContext('2d');
        chartInstance.current = new window.Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: labels,
            datasets: [{
              data: data,
              backgroundColor: colors || ['#4f46e5', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6', '#64748b'],
              borderWidth: 0,
              hoverOffset: 6
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'right', labels: { boxWidth: 12, usePointStyle: true, font: { family: "'Inter', sans-serif", size: 11 } } },
              tooltip: {
                backgroundColor: 'rgba(15, 23, 42, 0.9)',
                titleFont: { family: "'Inter', sans-serif" },
                bodyFont: { family: "'Inter', sans-serif" },
                padding: 12,
                cornerRadius: 8,
                callbacks: {
                  label: function(context) {
                    let label = context.label || '';
                    if (label) { label += ': '; }
                    // ChartJS v3/4 uses raw or parsed, checking both to be safe
                    const val = context.raw !== undefined ? context.raw : context.parsed;
                    if (val !== null && val !== undefined) {
                      label += isCurrency ? new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(val) : val + ' item';
                    }
                    return label;
                  }
                }
              }
            },
            cutout: '70%'
          }
        });
        
        return () => {
          if (chartInstance.current) {
            chartInstance.current.destroy();
          }
        };
      }, [data, labels, title, colors, isCurrency]);

      if (!data || data.length === 0) {
        return <div className="h-[250px] flex items-center justify-center text-slate-400 text-sm font-medium border-2 border-dashed border-slate-200 rounded-2xl">Belum ada data memadai</div>;
      }

      return (
        <div className="flex flex-col h-full">
          <h3 className="font-bold text-slate-700 mb-4">{title}</h3>
          <div className="relative flex-1 min-h-[220px]">
            <canvas ref={chartRef}></canvas>
          </div>
        </div>
      );
    }

    // --- KOMPONEN LAPORAN ---
    function AdminReport({ transactions, storeConfig }) {
        const [filter, setFilter] = useState('today');
        const [startDate, setStartDate] = useState(new Date().toISOString().split('T')[0]);
        const [endDate, setEndDate] = useState(new Date().toISOString().split('T')[0]);
        
        const filteredTransactions = useMemo(() => {
        const now = new Date();
        return transactions.filter(trx => {
          const d = new Date(trx.date);
          
          if (filter === 'today') return d.toDateString() === now.toDateString();
          if (filter === 'week') {
            const startOfWeek = new Date();
            startOfWeek.setDate(now.getDate() - now.getDay());
            startOfWeek.setHours(0, 0, 0, 0);
            return d >= startOfWeek;
          }
          if (filter === 'month') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
          if (filter === 'custom') {
            const start = new Date(startDate);
            const end = new Date(endDate);
            start.setHours(0, 0, 0, 0);
            end.setHours(23, 59, 59, 999);
            return d >= start && d <= end;
          }
          return true;
        });
      }, [transactions, filter, startDate, endDate]);

      // Catatan: Transaksi "Belum Bayar" tidak akan dihitung masuk ke Omzet & Laba
      const calcSummary = (trxs) => trxs.reduce((acc, trx) => {
        if (trx.method !== 'Belum Bayar') {
          acc.omzet += trx.total;
          trx.items.forEach(i => {
            acc.modal += (i.modal || 0) * i.qty;
            acc.laba += (i.price - (i.modal || 0)) * i.qty;
          });
        }
        return acc;
      }, { omzet: 0, modal: 0, laba: 0 });

      const summary = calcSummary(filteredTransactions);

      const paymentStats = useMemo(() => {
        const stats = {};
        filteredTransactions.forEach(trx => {
          if (trx.method !== 'Belum Bayar') {
            stats[trx.method] = (stats[trx.method] || 0) + trx.total;
          }
        });
        return { labels: Object.keys(stats), data: Object.values(stats) };
      }, [filteredTransactions]);

      const productStats = useMemo(() => {
        const stats = {};
        filteredTransactions.forEach(trx => {
          if (trx.method !== 'Belum Bayar') {
            trx.items.forEach(item => {
              stats[item.name] = (stats[item.name] || 0) + item.qty;
            });
          }
        });
        const sorted = Object.entries(stats).sort((a, b) => b[1] - a[1]).slice(0, 5);
        return { labels: sorted.map(s => s[0]), data: sorted.map(s => s[1]) };
      }, [filteredTransactions]);

      const downloadPDF = () => {
        if(!window.jspdf) return showAlert({icon:'error', title:'Error', text:'Library PDF belum dimuat.'});
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');
        doc.setFontSize(16); doc.text(`Laporan Penjualan - ${storeConfig.name}`, 14, 15);
        doc.setFontSize(10); doc.text(`Periode: ${filter.toUpperCase()} | Dicetak: ${new Date().toLocaleString('id-ID')}`, 14, 22);
        
        const tableData = filteredTransactions.map(trx => {
          const trxSum = calcSummary([trx]);
          const idText = trx.queueNo ? `${trx.id} (Antrean: ${trx.queueNo})` : trx.id;
          return [idText, new Date(trx.date).toLocaleDateString('id-ID'), trx.method, formatRp(trxSum.modal), formatRp(trx.total), formatRp(trxSum.laba)];
        });

        doc.autoTable({
          startY: 28, head: [['ID Transaksi', 'Tanggal', 'Metode', 'Total Modal', 'Total Omzet', 'Laba Bersih']],
          body: tableData, theme: 'grid', headStyles: { fillColor: [79, 70, 229] },
          foot: [['', '', 'GRAND TOTAL', formatRp(summary.modal), formatRp(summary.omzet), formatRp(summary.laba)]],
          footStyles: { fillColor: [241, 245, 249], textColor: [15, 23, 42], fontStyle: 'bold' }
        });
        doc.save(`Laporan_${filter}_${Date.now()}.pdf`);
      };

      const downloadExcel = () => {
        if(!window.XLSX) return showAlert({icon:'error', title:'Error', text:'Library Excel belum dimuat.'});
        
        // Siapkan data array object untuk Excel
        const excelData = [];
        
        filteredTransactions.forEach(trx => {
          const trxSum = calcSummary([trx]);
          // Gabungkan item & catatan menjadi satu string rapi
          const itemsStr = trx.items.map(i => i.note ? `${i.name} (${i.note}) x${i.qty}` : `${i.name} x${i.qty}`).join(', ');
          
          excelData.push({
            'ID Transaksi': trx.queueNo ? `${trx.id} (Antrean: ${trx.queueNo})` : trx.id,
            'Tanggal': new Date(trx.date).toLocaleString('id-ID'),
            'Item Terjual': itemsStr,
            'Metode Pembayaran': trx.method,
            'Total Modal (Rp)': trxSum.modal,
            'Total Omzet (Rp)': trx.total,
            'Laba Bersih (Rp)': trxSum.laba
          });
        });

        // Tambahkan baris kosong sebagai pemisah, lalu baris Grand Total
        excelData.push({});
        excelData.push({
          'ID Transaksi': 'GRAND TOTAL',
          'Tanggal': '',
          'Item Terjual': '',
          'Metode Pembayaran': '',
          'Total Modal (Rp)': summary.modal,
          'Total Omzet (Rp)': summary.omzet,
          'Laba Bersih (Rp)': summary.laba
        });

        // Konversi ke worksheet Excel
        const ws = window.XLSX.utils.json_to_sheet(excelData);
        const wb = window.XLSX.utils.book_new();
        window.XLSX.utils.book_append_sheet(wb, ws, "Laporan_Penjualan");
        
        // Atur lebar kolom biar rapi pas dibuka
        ws['!cols'] = [{wch: 25}, {wch: 20}, {wch: 45}, {wch: 20}, {wch: 18}, {wch: 18}, {wch: 18}];

        // Download file
        window.XLSX.writeFile(wb, `Laporan_${filter}_${Date.now()}.xlsx`);
      };

      return (
        <div className="space-y-6 animate-fade-in">
          <div className="flex flex-col lg:flex-row justify-between lg:items-center gap-4 bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-100">
            <div>
              <h2 className="text-2xl md:text-3xl font-black text-slate-800">Laporan Keuangan</h2>
              <p className="text-slate-500 font-medium mt-1">Status <b>Belum Bayar (Antrean)</b> tidak dihitung sebagai omzet/laba.</p>
            </div>
            <div className="flex flex-col sm:flex-row items-center gap-3">
              <div className="relative bg-white rounded-xl flex items-center border border-slate-200 shrink-0 w-full sm:w-auto shadow-sm hover:border-indigo-300 transition-colors">
                <Icon name="filter_list" className="text-indigo-500 absolute left-3.5 text-[18px] pointer-events-none" />
                <select value={filter} onChange={(e) => setFilter(e.target.value)} className="w-full pl-10 pr-10 py-3 bg-transparent text-sm font-bold text-slate-700 outline-none appearance-none cursor-pointer">
                  <option value="today">Hari Ini</option>
                  <option value="week">Minggu Ini</option>
                  <option value="month">Bulan Ini</option>
                  <option value="custom">Pilih Kalender</option>
                </select>
                <Icon name="expand_more" className="text-slate-500 absolute right-3 pointer-events-none" />
              </div>
            
              {filter === 'custom' && (
                <div className="flex items-center gap-2 bg-slate-50 p-1.5 rounded-xl border border-indigo-100 shadow-inner w-full sm:w-auto">
                  <input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} className="bg-white rounded-lg text-xs font-bold text-slate-700 outline-none p-2 cursor-pointer border border-slate-200" />
                  <span className="text-slate-400 font-black">-</span>
                  <input type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} className="bg-white rounded-lg text-xs font-bold text-slate-700 outline-none p-2 cursor-pointer border border-slate-200" />
                </div>
              )}
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div className="bg-gradient-to-br from-indigo-500 to-blue-600 p-6 md:p-8 rounded-3xl text-white shadow-xl shadow-blue-200/50 relative overflow-hidden group hover:scale-[1.02] transition-transform">
              <Icon name="payments" className="absolute -right-4 -bottom-4 text-[100px] text-white/10 group-hover:scale-110 transition-transform" />
              <div className="relative z-10">
                <p className="text-blue-100 font-bold mb-2 text-sm uppercase tracking-wider">Total Omzet</p>
                <h3 className="text-3xl md:text-4xl font-black">{formatRp(summary.omzet)}</h3>
                <p className="text-sm mt-4 font-medium bg-black/10 inline-block px-3 py-1 rounded-full">{filteredTransactions.filter(t=>t.method!=='Belum Bayar').length} Transaksi Selesai</p>
              </div>
            </div>
            <div className="bg-gradient-to-br from-orange-500 to-rose-500 p-6 md:p-8 rounded-3xl text-white shadow-xl shadow-orange-200/50 relative overflow-hidden group hover:scale-[1.02] transition-transform">
              <Icon name="inventory_2" className="absolute -right-4 -bottom-4 text-[100px] text-white/10 group-hover:scale-110 transition-transform" />
              <div className="relative z-10">
                <p className="text-orange-100 font-bold mb-2 text-sm uppercase tracking-wider">Total Harga Modal</p>
                <h3 className="text-3xl md:text-4xl font-black">{formatRp(summary.modal)}</h3>
                <p className="text-sm mt-4 font-medium bg-black/10 inline-block px-3 py-1 rounded-full">Aset terjual lunas</p>
              </div>
            </div>
            <div className="bg-gradient-to-br from-emerald-400 to-emerald-600 p-6 md:p-8 rounded-3xl text-white shadow-xl shadow-emerald-200/50 relative overflow-hidden group hover:scale-[1.02] transition-transform">
              <Icon name="trending_up" className="absolute -right-4 -bottom-4 text-[100px] text-white/10 group-hover:scale-110 transition-transform" />
              <div className="relative z-10">
                <p className="text-emerald-100 font-bold mb-2 text-sm uppercase tracking-wider">Laba Bersih</p>
                <h3 className="text-3xl md:text-4xl font-black">{formatRp(summary.laba)}</h3>
                <p className="text-sm mt-4 font-medium bg-black/10 inline-block px-3 py-1 rounded-full">Omzet dikurangi Modal</p>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-100">
              <PieChart title="Pendapatan per Metode Pembayaran" labels={paymentStats.labels} data={paymentStats.data} colors={['#10b981', '#3b82f6', '#f59e0b']} isCurrency={true}/>
            </div>
            <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-100">

          <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
            <div className="p-5 md:p-6 border-b border-slate-100 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 bg-slate-50/50">
              <h3 className="font-bold text-lg text-slate-800">Rincian Transaksi</h3>
              <div className="flex flex-wrap gap-2">
                <button onClick={downloadExcel} className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 md:px-5 py-2.5 rounded-xl text-sm font-bold flex items-center justify-center gap-2 shadow-md shadow-emerald-600/20 transition-all active:scale-95">
                  <Icon name="table_view" className="text-base"/> Export Excel
                </button>

      const openModal = (p = null) => {
        setFormData(p ? {...p} : { id: `P${Date.now().toString().slice(-6)}`, name: '', category: categories[0]?.name || '', stock: 0, modal: 0, price: 0, diskon: 0, image: '' });
        setIsModalOpen(true);
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 300; const MAX_HEIGHT = 300; 
            let width = img.width; let height = img.height;

            if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } } 
            else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }

            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
            setFormData({ ...formData, image: dataUrl });
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);

      const saveProduct = (e) => {

              className="bg-indigo-600 text-white px-6 py-3.5 rounded-2xl font-bold hover:bg-indigo-700 shadow-lg shadow-indigo-200 flex items-center justify-center gap-2 transition-all active:scale-95 shrink-0"
            >
              <Icon name="person_add" className="text-lg" /> 
              <span>Tambah Staff</span>
            </button>          
          </div>

          <div className="bg-white rounded-3xl border border-slate-100 overflow-hidden shadow-sm">
            <div className="overflow-x-auto hide-scrollbar scroll-momentum">
              <table className="w-full text-left text-sm whitespace-nowrap min-w-[600px]">
                <thead className="bg-slate-50 text-slate-500 uppercase text-[11px] font-black tracking-widest border-b border-slate-100">
                  <tr><th className="p-5 pl-6">Peran / Posisi</th><th className="p-5">Nama Staff</th><th className="p-5">PIN</th><th className="p-5 text-center">Status</th><th className="p-5 text-center pr-6">Aksi</th></tr>
                </thead>
                <tbody className="divide-y divide-slate-50">
                  {(users || []).map(u => (
                    <tr key={u.id} className="hover:bg-slate-50/80 transition-colors">
                      <td className="p-5 pl-6 font-black text-indigo-600 uppercase text-xs">{u.kode}</td>
                      <td className="p-5 font-bold text-slate-800">{u.nama}</td>
                      <td className="p-5 font-mono text-slate-500 font-bold tracking-[0.2em]">{u.pin}</td>
                      <td className="p-5 text-center"><span className={`px-3 py-1.5 rounded-lg text-[10px] font-black uppercase ${u.status === 'aktif' ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}`}>{u.status}</span></td>
                      <td className="p-5 pr-6">
                        <div className="flex justify-center gap-2">
                           <button onClick={()=>openModal(u)} className="p-2.5 text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-xl transition-colors"><Icon name="edit" className="text-[18px]"/></button>
                           <button onClick={()=>delUser(u.id)} className="p-2.5 text-red-500 bg-red-50 hover:bg-red-100 rounded-xl transition-colors"><Icon name="delete" className="text-[18px]"/></button>
                        </div>
                      </td>
                    </tr>
                  ))}
                  {!users?.length && <tr><td colSpan="5" className="p-16 text-center text-slate-400 font-medium">Belum ada data pegawai terdaftar.</td></tr>}
                </tbody>
              </table>
            </div>
          </div>

          {isModalOpen && ReactDOM.createPortal(
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[999] flex items-center justify-center p-4">
              <div className="bg-white rounded-[2rem] w-full max-w-md shadow-2xl p-6 md:p-8 transform transition-all scale-100">
                <h3 className="text-2xl font-black mb-6 text-slate-800">{formData.nama ? 'Edit Staff' : 'Tambah Staff'}</h3>
                <form onSubmit={handleSave} className="space-y-5">
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-500 mb-1.5">Posisi (admin/kasir)</label>
                      <input required value={formData.kode} onChange={e=>setFormData({...formData, kode: e.target.value.toLowerCase()})} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-indigo-500 font-bold text-slate-700" placeholder="kasir" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-500 mb-1.5">Nama Panggilan</label>
                      <input required value={formData.nama} onChange={e=>setFormData({...formData, nama: e.target.value})} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-indigo-500 font-bold text-slate-700" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-500 mb-1.5">PIN Rahasia (Angka)</label>
                    <input required type="text" pattern="\d*" value={formData.pin} onChange={e=>setFormData({...formData, pin: e.target.value.replace(/\D/g,'')})} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-indigo-500 font-mono text-xl tracking-[0.2em] font-black text-slate-700 text-center" placeholder="1234" maxLength="6" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-500 mb-1.5">Status Akun</label>
                    <select value={formData.status} onChange={e=>setFormData({...formData, status: e.target.value})} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-indigo-500 font-bold text-slate-700">
                      <option value="aktif">🟢 Aktif</option>
                      <option value="nonaktif">🔴 Nonaktif</option>
                    </select>
                  </div>
                  
                  <div className="pt-2 flex flex-col gap-3">
                    <button type="submit" className="w-full bg-indigo-600 text-white p-4 rounded-2xl font-black text-lg shadow-xl shadow-indigo-200 hover:bg-indigo-700 active:scale-95 transition-all">SIMPAN DATA</button>
                    <button type="button" onClick={()=>setIsModalOpen(false)} className="w-full bg-slate-100 text-slate-600 p-4 rounded-2xl font-bold hover:bg-slate-200 transition-colors">Batal</button>
                  </div>
                </form>
              </div>
            </div>,
            document.body
          )}
        </div>
      );
    }

    // --- KOMPONEN PENGATURAN ADMIN ---
    function AdminSettings({ storeConfig, setStoreConfig, syncToSheets }) {
      const [form, setForm] = useState(storeConfig);
      
      const save = (e) => { 
        e.preventDefault(); 
        setStoreConfig(form); 
        syncToSheets('UPDATE_SETTINGS', form); 
        showAlert({icon:'success', title:'Tersimpan', text:'Konfigurasi toko berhasil diperbarui.'}); 
      };

      const handleLogoUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_SIZE = 250; 
            let width = img.width; let height = img.height;
            
            if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
            else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
            
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);
            
            setForm({ ...form, logo: canvas.toDataURL('image/jpeg', 0.6) });
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      return (
        <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-100 max-w-2xl animate-fade-in">
          <h2 className="text-2xl md:text-3xl font-black text-slate-800 mb-2">Profil Toko</h2>
          <p className="font-medium text-slate-500 mb-8">Informasi ini akan ditampilkan pada header struk kasir.</p>
          
          <form onSubmit={save} className="space-y-5">
            <div className="flex flex-col sm:flex-row items-start sm:items-center gap-5 p-5 bg-slate-50 border border-slate-100 rounded-2xl mb-2">
              {form.logo ? (
                <div className="relative w-24 h-24 rounded-[1rem] overflow-hidden border border-slate-200 shrink-0 bg-white flex items-center justify-center p-2 shadow-sm">
                  <img src={form.logo} className="w-full h-full object-contain" alt="Logo Preview" />
                  <button type="button" onClick={() => setForm({...form, logo: ''})} className="absolute inset-0 bg-black/60 text-white flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity rounded-[1rem]"><Icon name="delete"/></button>
                </div>
              ) : (
                <div className="w-24 h-24 rounded-[1rem] bg-white border border-slate-200 flex items-center justify-center shrink-0 text-slate-300 shadow-sm">
                  <Icon name="storefront" className="text-4xl" />
                </div>
              )}
              <div className="flex-1 w-full">
                <label className="block text-xs font-bold text-slate-600 mb-2">Upload Logo Baru (Rekomendasi Kotak/Square)</label>
                <input type="file" accept="image/*" onChange={handleLogoUpload} className="w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-5 file:rounded-xl file:border-0 file:text-xs file:font-black file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 outline-none cursor-pointer transition-colors"/>
              </div>
            </div>

            <div>
              <label className="block text-xs font-bold text-slate-500 mb-1.5 ml-1">Nama Usaha / Toko</label>
              <input required type="text" value={form.name} onChange={e=>setForm({...form, name:e.target.value})} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 font-bold text-slate-800 transition-all"/>
            </div>
            
            <div>
              <label className="block text-xs font-bold text-slate-500 mb-1.5 ml-1">Alamat Lengkap</label>
              <textarea required rows="2" value={form.address} onChange={e=>setForm({...form, address:e.target.value})} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 font-medium text-slate-800 transition-all resize-none"/>
            </div>
            
            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
              <div>
                <label className="block text-xs font-bold text-slate-500 mb-1.5 ml-1">Kontak (Telp / WA)</label>
                <input required type="text" value={form.phone} onChange={e=>setForm({...form, phone:e.target.value})} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 font-bold text-slate-800 transition-all"/>
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-500 mb-1.5 ml-1">Pesan Penutup (Footer Struk)</label>
                <input required type="text" value={form.footer} onChange={e=>setForm({...form, footer:e.target.value})} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 font-medium text-slate-800 transition-all"/>
              </div>
            </div>
            
            <button type="submit" className="w-full bg-slate-800 text-white p-4.5 py-4 rounded-2xl font-black shadow-xl shadow-slate-200 hover:bg-slate-900 active:scale-95 transition-all mt-4 flex justify-center items-center gap-2">
              <Icon name="save" className="text-xl" /> SIMPAN PERUBAHAN
            </button>
          </form>
        </div>
      )
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
